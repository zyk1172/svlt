name: Temporary export coordinator cleanup

on:
  push:
    branches:
      - codex/extract-export-coordinator

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/extract-export-coordinator
          fetch-depth: 0

      - name: Restore presentation-only target order
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("SVLT.xcodeproj/project.pbxproj")
          text = path.read_text()
          generated = (
              "\t\t\ttargets = (\n"
              "\t\t\t\t220CDA200412FA123E185C24 /* VaultCore */,\n"
              "\t\t\t\t561F723C545CFF984CFD7A7D /* VaultCoreTests */,\n"
              "\t\t\t\t839BA397656D992385802D9A /* VaultAuthorization */,\n"
              "\t\t\t\t160319EC3D54A6D48327EF69 /* VaultExecution */,\n"
              "\t\t\t\tB74A522843B3D6B8F8D2D0F6 /* VaultService */,\n"
              "\t\t\t\t4D4AAA86B56416ED476802A7 /* VaultIPC */,\n"
              "\t\t\t\tBE4703D12B227579B175C972 /* AgentSecretVaultApp */,\n"
              "\t\t\t\t518A74E184DD0753026716CD /* SVLTAgent */,\n"
              "\t\t\t\t5248DC09F2511964B47BA1C6 /* AgentSecretVault */,\n"
              "\t\t\t\t11FA050282C48DA372F026A5 /* AgentSecretVaultAppTests */,\n"
              "\t\t\t\tB1504E1197E69DE63A69534C /* VaultAuthorizationTests */,\n"
              "\t\t\t\t579CF4058E72E253F0EA1615 /* VaultExecutionTests */,\n"
              "\t\t\t\tA2D83343D01B65E759D05B81 /* VaultIPCTests */,\n"
              "\t\t\t\t9B25E141FA32BA15CC63CDBD /* LeakTests */,\n"
              "\t\t\t);\n"
          )
          stable = (
              "\t\t\ttargets = (\n"
              "\t\t\t\t5248DC09F2511964B47BA1C6 /* AgentSecretVault */,\n"
              "\t\t\t\tBE4703D12B227579B175C972 /* AgentSecretVaultApp */,\n"
              "\t\t\t\t11FA050282C48DA372F026A5 /* AgentSecretVaultAppTests */,\n"
              "\t\t\t\t9B25E141FA32BA15CC63CDBD /* LeakTests */,\n"
              "\t\t\t\t518A74E184DD0753026716CD /* SVLTAgent */,\n"
              "\t\t\t\t839BA397656D992385802D9A /* VaultAuthorization */,\n"
              "\t\t\t\tB1504E1197E69DE63A69534C /* VaultAuthorizationTests */,\n"
              "\t\t\t\t220CDA200412FA123E185C24 /* VaultCore */,\n"
              "\t\t\t\t561F723C545CFF984CFD7A7D /* VaultCoreTests */,\n"
              "\t\t\t\t160319EC3D54A6D48327EF69 /* VaultExecution */,\n"
              "\t\t\t\t579CF4058E72E253F0EA1615 /* VaultExecutionTests */,\n"
              "\t\t\t\t4D4AAA86B56416ED476802A7 /* VaultIPC */,\n"
              "\t\t\t\tA2D83343D01B65E759D05B81 /* VaultIPCTests */,\n"
              "\t\t\t\tB74A522843B3D6B8F8D2D0F6 /* VaultService */,\n"
              "\t\t\t);\n"
          )
          assert text.count(generated) == 1
          path.write_text(text.replace(generated, stable, 1))
          PY
          git diff --check
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          ./scripts/check-xcodegen-parity.sh

      - name: Commit project cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SVLT.xcodeproj/project.pbxproj
          git diff --cached --exit-code && exit 1 || true
          git commit -m "chore: keep Xcode target ordering stable"
          git push origin HEAD:codex/extract-export-coordinator
