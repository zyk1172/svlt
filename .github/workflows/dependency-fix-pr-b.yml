name: Dependency Fix PR B

on:
  push:
    branches:
      - codex/fix-dependency-advisories

permissions:
  contents: write

jobs:
  update-lockfiles:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-dependency-advisories
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            mcp-server/package-lock.json
            obsidian-plugin/svlt/package-lock.json
      - name: Repair MCP dependency advisories
        working-directory: mcp-server
        run: |
          npm ci
          npm audit fix --package-lock-only
          npm ci
          npm audit --audit-level=moderate
          npm run typecheck
          npm test
          npm run build
      - name: Repair Obsidian Vitest advisory
        working-directory: obsidian-plugin/svlt
        run: |
          npm ci
          npm install --save-dev --package-lock-only 'vitest@^4.1.11'
          npm ci
          npm audit --audit-level=moderate
          npm run typecheck
          npm test
          npm run build
      - name: Commit dependency updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mcp-server/package-lock.json obsidian-plugin/svlt/package.json obsidian-plugin/svlt/package-lock.json
          if git diff --cached --quiet; then
            echo 'No dependency changes generated'
            exit 1
          fi
          git commit -m 'chore: resolve moderate dependency advisories'
          git push origin HEAD:codex/fix-dependency-advisories
