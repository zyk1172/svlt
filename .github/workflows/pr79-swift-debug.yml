name: PR79 Swift Diagnostics

on:
  push:
    branches:
      - codex/daemon-owned-catalog-state
    paths:
      - .github/workflows/pr79-swift-debug.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/daemon-owned-catalog-state
      - name: Run matching Swift test command and capture diagnostics
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/svlt-xcodebuild.log"
          set +e
          xcodebuild test \
            -project SVLT.xcodeproj \
            -scheme AgentSecretVault \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/svlt-derived" \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 3 \
            -test-repetition-relaunch-enabled YES \
            CODE_SIGNING_ALLOWED=NO >"$log" 2>&1
          status=$?
          {
            echo "xcodebuild_status=$status"
            echo "=== explicit compiler diagnostics ==="
            grep -nE '(^|[[:space:]])(fatal )?error:' "$log" || true
            echo "=== test failures ==="
            grep -nE '(Test Case .* failed|Test .* failed|✘|Issue recorded|XCTAssert|#expect|FAILED|Failing tests:)' "$log" | tail -n 300 || true
            echo "=== final log tail ==="
            tail -n 350 "$log"
          } > .github/pr79-swift-diagnostics.txt
      - name: Commit diagnostics and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr79-swift-debug.yml
          git add .github/pr79-swift-diagnostics.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: capture PR79 Swift failure diagnostics"
          git push origin HEAD:codex/daemon-owned-catalog-state
