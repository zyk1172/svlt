name: Regenerate Xcode Project Once

on:
  push:
    branches: [codex/secret-operation-service-slice]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/secret-operation-service-slice
          fetch-depth: 0
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Regenerate checked-in project
        run: xcodegen generate --quiet --spec project.yml --project . --project-root .
      - name: Commit project sync and remove one-shot workflow
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/regenerate-xcode-project-once.yml
          git add SVLT.xcodeproj
          git commit -m "build: regenerate Xcode project for secret operation service"
          for attempt in 1 2 3; do
            if git push origin HEAD:codex/secret-operation-service-slice; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
