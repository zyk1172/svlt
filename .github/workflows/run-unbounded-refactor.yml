name: Run unbounded execution refactor

on:
  push:
    branches:
      - codex/approval-2m-unbounded-execution

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/approval-2m-unbounded-execution
          fetch-depth: 0

      - name: Apply source refactor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-unbounded-execution-refactor.py')
          s = p.read_text()
          old = 'if schema_count != 7:'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'if schema_count != 9:', 1))
          PY
          python3 scripts/apply-unbounded-execution-refactor.py
          git diff --check

      - name: Run Swift tests
        run: |
          xcodebuild test \
            -project SVLT.xcodeproj \
            -scheme AgentSecretVault \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/svlt-derived" \
            CODE_SIGNING_ALLOWED=NO

      - name: Run MCP checks
        working-directory: mcp-server
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Check architecture budgets
        run: bash scripts/check-architecture-budgets.sh

      - name: Commit verified refactor
        run: |
          git rm .github/workflows/audit-execution-timeouts.yml
          git rm .github/workflows/apply-unbounded-execution.yml
          git rm .github/workflows/run-unbounded-refactor.yml
          git rm scripts/apply-unbounded-execution-refactor.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Sources Tests mcp-server
          git commit -m 'fix: decouple approval timeout from execution lifetime'
          git push origin HEAD:codex/approval-2m-unbounded-execution
