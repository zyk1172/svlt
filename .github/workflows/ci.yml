name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: svlt-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-tests:
    name: Swift tests
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run macOS test suite
        run: |
          # Catalog POSIX probes are deliberately bounded because a
          # File Provider syscall can outlive the caller's timeout. Hosted
          # runners can therefore leave a timed-out probe in the test process
          # and make the next test fail immediately on the shared permit pool.
          # Keep bundle execution serial and relaunch failed tests so a
          # transient provider timeout cannot poison a retry; persistent
          # failures still fail this job.
          xcodebuild test \
            -project SVLT.xcodeproj \
            -scheme AgentSecretVault \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/svlt-derived" \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 3 \
            -test-repetition-relaunch-enabled YES \
            CODE_SIGNING_ALLOWED=NO
      - name: Scan Swift build products for plaintext canary
        env:
          ASV_CANARY: ASV_CANARY_7F2D1C9E_DO_NOT_PERSIST
        run: |
          ./scripts/scan-plaintext.sh --require-paths "$RUNNER_TEMP/svlt-derived/Build/Products"
          ./scripts/scan-plaintext.sh test-artifacts

  xcodegen-parity:
    name: XcodeGen project parity
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install XcodeGen when unavailable
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
      - name: Verify checked-in Xcode project parity
        run: ./scripts/check-xcodegen-parity.sh

  mcp:
    name: MCP typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - name: Install dependencies
        working-directory: mcp-server
        run: npm ci
      - name: Audit dependencies
        working-directory: mcp-server
        run: npm audit --audit-level=high
      - name: Typecheck, test, and build
        working-directory: mcp-server
        run: npm run typecheck && npm test && npm run build
      - name: Scan MCP generated artifacts for plaintext canary
        env:
          ASV_CANARY: ASV_CANARY_7F2D1C9E_DO_NOT_PERSIST
        run: |
          ./scripts/scan-plaintext.sh --require-paths mcp-server/dist
          ./scripts/scan-plaintext.sh mcp-server/test-artifacts mcp-server/captures mcp-server/fixtures/transcripts

  obsidian:
    name: Obsidian typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: obsidian-plugin/svlt/package-lock.json
      - name: Install dependencies
        working-directory: obsidian-plugin/svlt
        run: npm ci
      - name: Audit dependencies
        working-directory: obsidian-plugin/svlt
        run: npm audit --audit-level=high
      - name: Typecheck, test, and build
        working-directory: obsidian-plugin/svlt
        run: npm run typecheck && npm test && npm run build && npm run check:build-artifact
      - name: Scan Obsidian generated artifacts for plaintext canary
        env:
          ASV_CANARY: ASV_CANARY_7F2D1C9E_DO_NOT_PERSIST
        run: |
          ./scripts/scan-plaintext.sh --require-paths obsidian-plugin/svlt/main.js
          ./scripts/scan-plaintext.sh obsidian-plugin/svlt/dist

  security-scan:
    name: Security and repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR may contain several commits; the security check compares
          # the complete PR range against origin/main.
          fetch-depth: 0
      - name: Check shell scripts and executable release E2E entrypoint
        run: |
          bash -n scripts/*.sh
          test -x scripts/release-e2e.sh
      - name: Enforce large-file architecture budgets
        run: bash scripts/check-architecture-budgets.sh
      - name: Check whitespace
        run: |
          # Select the complete event range instead of checking only the
          # latest commit. origin/main is not a reliable PR base when the
          # checkout is a merge ref or the workflow runs from a fork.
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              base="${{ github.event.before }}"
              head="${{ github.sha }}"
              if [[ "$base" =~ ^0+$ ]]; then
                base="$(git rev-list --max-parents=0 "$head" | tail -n 1)"
              fi
              ;;
            *)
              head="$GITHUB_SHA"
              # Manual runs have no event-provided base. Prefer the
              # repository's main merge base so historical whitespace is not
              # re-reported; fall back to the immediate parent only when the
              # remote ref is unavailable.
              if git rev-parse --verify origin/main >/dev/null 2>&1; then
                base="$(git merge-base origin/main "$head")"
              else
                base="$(git rev-parse "$head^" 2>/dev/null || printf '%s' "$head")"
              fi
              ;;
          esac
          git diff --check "$base...$head"
      - name: Verify plaintext scanner fails closed
        env:
          ASV_CANARY: ASV_CANARY_7F2D1C9E_DO_NOT_PERSIST
        run: |
          fixture="$RUNNER_TEMP/svlt-plaintext-scan-contract"
          rm -rf "$fixture"
          mkdir -p "$fixture"
          printf 'safe artifact\n' > "$fixture/safe.txt"
          ./scripts/scan-plaintext.sh --require-paths "$fixture"

          printf '%s\n' "$ASV_CANARY" > "$fixture/leak.txt"
          if ./scripts/scan-plaintext.sh --require-paths "$fixture" >/dev/null 2>&1; then
            echo "Plaintext scanner failed to detect the canary fixture" >&2
            exit 1
          fi

          rm -rf "$fixture"
          if ./scripts/scan-plaintext.sh --require-paths "$fixture/missing" >/dev/null 2>&1; then
            echo "Plaintext scanner accepted a missing required path" >&2
            exit 1
          fi
