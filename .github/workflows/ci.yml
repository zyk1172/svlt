name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: svlt-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-tests:
    name: Swift tests
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run macOS test suite
        run: |
          # Catalog POSIX probes are deliberately bounded because a
          # File Provider syscall can outlive the caller's timeout. Hosted
          # runners can therefore leave a timed-out probe in the test process
          # and make the next test fail immediately on the shared permit pool.
          # Keep bundle execution serial and relaunch failed tests so a
          # transient provider timeout cannot poison a retry; persistent
          # failures still fail this job.
          xcodebuild test \
            -project SVLT.xcodeproj \
            -scheme AgentSecretVault \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/svlt-derived" \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 3 \
            -test-repetition-relaunch-enabled YES \
            CODE_SIGNING_ALLOWED=NO

  mcp:
    name: MCP typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - name: Install dependencies
        working-directory: mcp-server
        run: npm ci
      - name: Audit dependencies
        working-directory: mcp-server
        run: npm audit --audit-level=high
      - name: Typecheck, test, and build
        working-directory: mcp-server
        run: npm run typecheck && npm test && npm run build

  obsidian:
    name: Obsidian typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: obsidian-plugin/svlt/package-lock.json
      - name: Install dependencies
        working-directory: obsidian-plugin/svlt
        run: npm ci
      - name: Audit dependencies
        working-directory: obsidian-plugin/svlt
        run: npm audit --audit-level=high
      - name: Typecheck, test, and build
        working-directory: obsidian-plugin/svlt
        run: npm run typecheck && npm test && npm run build && npm run check:build-artifact

  security-scan:
    name: Security and repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The PR may contain several commits; the security check compares
          # the complete PR range against origin/main.
          fetch-depth: 0
      - name: Check shell scripts and executable release E2E entrypoint
        run: |
          bash -n scripts/*.sh
          test -x scripts/release-e2e.sh
      - name: Check whitespace
        run: |
          # Select the complete event range instead of checking only the
          # latest commit. origin/main is not a reliable PR base when the
          # checkout is a merge ref or the workflow runs from a fork.
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              base="${{ github.event.before }}"
              head="${{ github.sha }}"
              if [[ "$base" =~ ^0+$ ]]; then
                base="$(git rev-list --max-parents=0 "$head" | tail -n 1)"
              fi
              ;;
            *)
              head="$GITHUB_SHA"
              # Manual runs have no event-provided base. Prefer the
              # repository's main merge base so historical whitespace is not
              # re-reported; fall back to the immediate parent only when the
              # remote ref is unavailable.
              if git rev-parse --verify origin/main >/dev/null 2>&1; then
                base="$(git merge-base origin/main "$head")"
              else
                base="$(git rev-parse "$head^" 2>/dev/null || printf '%s' "$head")"
              fi
              ;;
          esac
          git diff --check "$base...$head"
      - name: Scan generated artifacts for plaintext canary
        env:
          ASV_CANARY: ASV_CANARY_7F2D1C9E_DO_NOT_PERSIST
        run: ./scripts/scan-plaintext.sh build test-artifacts mcp-server/dist obsidian-plugin/svlt/main.js obsidian-plugin/svlt/dist
