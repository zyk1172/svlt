name: Apply SSH timeout compatibility fix once

on:
  push:
    branches:
      - codex/fix-ssh-timeout-compat

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-ssh-timeout-compat
          fetch-depth: 0
      - name: Apply exact source and regression patches
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          server_path = Path("mcp-server/src/server.ts")
          server = server_path.read_text()

          command_old = "    sessionID: z.string().min(1).max(128).optional(),\n    timeoutMs: z.number().int().min(1_000).max(30_000).optional(),\n    agentAssessment: requiredAgentRiskAssessment"
          command_new = "    sessionID: z.string().min(1).max(128).optional(),\n    timeoutMs: z.number().int().positive().optional().describe(\n      \"Deprecated compatibility field; ignored. SSH execution has no fixed deadline.\"\n    ),\n    agentAssessment: requiredAgentRiskAssessment"
          if server.count(command_old) != 1:
              raise SystemExit(f"expected exactly one SSH command timeout block, found {server.count(command_old)}")
          server = server.replace(command_old, command_new, 1)

          batch_old = "    commands: z.array(SSHCommandSpec).min(1).max(32),\n    stopOnFailure: z.boolean().default(true),\n    timeoutMs: z.number().int().min(1_000).max(30_000).optional(),\n    agentAssessment: requiredAgentRiskAssessment"
          batch_new = "    commands: z.array(SSHCommandSpec).min(1).max(32),\n    stopOnFailure: z.boolean().default(true),\n    timeoutMs: z.number().int().positive().optional().describe(\n      \"Deprecated compatibility field; ignored. SSH execution has no fixed deadline.\"\n    ),\n    agentAssessment: requiredAgentRiskAssessment"
          if server.count(batch_old) != 1:
              raise SystemExit(f"expected exactly one SSH batch timeout block, found {server.count(batch_old)}")
          server = server.replace(batch_old, batch_new, 1)

          command_desc_old = '"Runs a raw SSH command (single-line or multi-line shell script: pipelines, redirects, heredocs, interpreters, sudo) on a local/private-network host using a secret:// password. SVLT classifies the actual effect: ordinary task-aligned work is automatic, while genuinely destructive effects require fresh owner approval. Plaintext is never returned."'
          command_desc_new = '"Runs a raw SSH command (single-line or multi-line shell script: pipelines, redirects, heredocs, interpreters, sudo) on a local/private-network host using a secret:// password. SVLT classifies the actual effect: ordinary task-aligned work is automatic, while genuinely destructive effects require fresh owner approval. SSH execution has no fixed 30-second deadline; omit deprecated timeoutMs for new calls. Plaintext is never returned."'
          if server.count(command_desc_old) != 1:
              raise SystemExit(f"expected one SSH command description, found {server.count(command_desc_old)}")
          server = server.replace(command_desc_old, command_desc_new, 1)

          batch_desc_old = '"Runs a structured SSH command batch (executable + arguments records) through one SVLT-managed ControlMaster session. Prefer raw commands when you need real shell semantics. Batch only reduces connection/protocol overhead; it is not required to avoid approval. Plaintext is never returned."'
          batch_desc_new = '"Runs a structured SSH command batch (executable + arguments records) through one SVLT-managed ControlMaster session. Prefer raw commands when you need real shell semantics. Batch only reduces connection/protocol overhead; it is not required to avoid approval. SSH execution has no fixed 30-second deadline; omit deprecated timeoutMs for new calls. Plaintext is never returned."'
          if server.count(batch_desc_old) != 1:
              raise SystemExit(f"expected one SSH batch description, found {server.count(batch_desc_old)}")
          server = server.replace(batch_desc_old, batch_desc_new, 1)

          workflow_old = '      "Use ssh_command_with_secret for one restricted local/private-network SSH command. An opaque sessionID may be reused for connection performance, but it is never required for authorization and never changes the risk decision.",\n'
          workflow_new = workflow_old + '      "SSH commands have no fixed execution deadline. timeoutMs is a deprecated compatibility field and is ignored; omit it for new SSH calls instead of splitting long-running work into artificial 30-second windows or retrying solely because 30 seconds elapsed.",\n'
          if server.count(workflow_old) != 1:
              raise SystemExit(f"expected one SSH workflow guidance line, found {server.count(workflow_old)}")
          server = server.replace(workflow_old, workflow_new, 1)
          server_path.write_text(server)

          test_path = Path("mcp-server/test/legacy-timeout-compat.test.ts")
          test = test_path.read_text()
          test_anchor = "  });\n});\n"
          long_test_lines = [
              "  });",
              "",
              '  it("accepts long deprecated timeoutMs values for SSH because the field is ignored", () => {',
              "    const longRunningTimeoutMs = 3_600_000;",
              "",
              '    expect(() => inputSchema("ssh_command_with_secret").parse({',
              '      host: "example.com",',
              "      passwordRef: reference,",
              '      command: "docker pull example/image:latest",',
              "      timeoutMs: longRunningTimeoutMs,",
              "      agentAssessment: assessment",
              "    })).not.toThrow();",
              "",
              '    expect(() => inputSchema("ssh_batch_with_secret").parse({',
              '      host: "example.com",',
              "      passwordRef: reference,",
              '      commands: [{ executable: "sleep", arguments: ["120"] }],',
              "      timeoutMs: longRunningTimeoutMs,",
              "      agentAssessment: assessment",
              "    })).not.toThrow();",
              "  });",
              "});",
              ""
          ]
          long_test = "\n".join(long_test_lines)
          if test.count(test_anchor) != 1:
              raise SystemExit(f"expected one test closing anchor, found {test.count(test_anchor)}")
          test = test.replace(test_anchor, long_test, 1)
          test_path.write_text(test)

          skill_path = Path("plugins/svlt/skills/svlt/SKILL.md")
          skill = skill_path.read_text()
          skill_anchor = "- 结构化 `ssh_batch_with_secret`（每项 `executable` + `arguments`）适合天然参数化的任务；不要为了审批策略强行拆分或拼接。两种形式都是一等公民。\n"
          skill_add = skill_anchor + "- SSH 执行没有固定 30 秒截止时间。`timeoutMs` 仅为历史兼容字段，当前 SSH 执行器会忽略；新调用应省略该字段，不要因为镜像拉取、构建、编译等长任务人为拆成 30 秒窗口，也不要仅因经过 30 秒就重复启动同一远端操作。\n"
          if skill.count(skill_anchor) != 1:
              raise SystemExit(f"expected one SSH skill anchor, found {skill.count(skill_anchor)}")
          skill = skill.replace(skill_anchor, skill_add, 1)
          skill_path.write_text(skill)
          PY

          git diff --check
          git diff -- mcp-server/src/server.ts mcp-server/test/legacy-timeout-compat.test.ts plugins/svlt/skills/svlt/SKILL.md
      - name: Commit patched files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mcp-server/src/server.ts mcp-server/test/legacy-timeout-compat.test.ts plugins/svlt/skills/svlt/SKILL.md
          git commit -m 'fix: remove artificial SSH timeout ceiling'
          git push origin HEAD:codex/fix-ssh-timeout-compat
