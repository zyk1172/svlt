name: PR79 Final Semantic Fix

on:
  push:
    branches:
      - codex/daemon-owned-catalog-state
    paths:
      - .github/workflows/pr79-final-audit-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/daemon-owned-catalog-state
      - name: Apply final semantic fix
        run: python3 scripts/pr79-final-audit-fix.py
      - name: Verify architecture budget and whitespace
        run: |
          bash scripts/check-architecture-budgets.sh
          git diff --check
      - name: Commit fix and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve catalog draft failure semantics"
          git push origin HEAD:codex/daemon-owned-catalog-state
