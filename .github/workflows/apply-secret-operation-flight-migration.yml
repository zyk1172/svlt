name: Apply Secret Operation Flight Migration

on:
  push:
    branches: [codex/secret-operation-service-slice]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/secret-operation-service-slice
          fetch-depth: 0
      - name: Apply asserted source transform
        run: python3 scripts/apply-secret-operation-flight-migration.py
      - name: Verify transform diff
        run: |
          git diff --check
          git diff -- Sources/VaultService/VaultAppServices.swift scripts/check-architecture-budgets.sh
      - name: Commit transformed source and remove one-shot machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-secret-operation-flight-migration.py .github/workflows/apply-secret-operation-flight-migration.yml
          git add Sources/VaultService/VaultAppServices.swift scripts/check-architecture-budgets.sh
          git commit -m "refactor: finish secret operation authorization slice"
          git push origin HEAD:codex/secret-operation-service-slice
