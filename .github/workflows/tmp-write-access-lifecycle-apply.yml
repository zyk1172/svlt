name: Temporary write access lifecycle apply

on:
  push:
    branches:
      - codex/extract-write-access-lifecycle

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Delegate write access lifecycle bookkeeping
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('Sources/VaultService/VaultAppServices.swift')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'private enum CatalogWriteAccessState: Sendable {\n'
              '    case pending\n'
              '    case authenticating\n'
              '    case approved\n'
              '    case consumed\n'
              '    case denied\n'
              '    case expired\n'
              '    case cancelled\n'
              '}\n\n',
              '',
              'state enum'
          )

          box_start = text.index('private final class CatalogWriteAccessContinuationBox: @unchecked Sendable {')
          box_end_marker = '\n}\n\npublic actor VaultAppServices:'
          box_end = text.index(box_end_marker, box_start)
          text = text[:box_start] + 'public actor VaultAppServices:' + text[box_end + len(box_end_marker):]

          replace_once(
              '    private var pendingWriteAccessRequests: [UUID: CatalogAgentWriteAccessRequest] = [:]\n'
              '    private var writeAccessContinuations: [UUID: CatalogWriteAccessContinuationBox] = [:]\n'
              '    private var writeAccessStates: [UUID: CatalogWriteAccessState] = [:]\n'
              '    /// The Agent creates the request context; the App later uses the same\n'
              '    /// correlation/request IDs when it records the device-owner decision.\n'
              '    private var pendingWriteAuditContexts: [UUID: AuditContext] = [:]\n',
              '    private var writeAccessLifecycle = CatalogWriteAccessLifecycle()\n',
              'state fields'
          )

          replace_once(
              '        pendingWriteAccessRequests[request.id] = request\n'
              '        writeAccessStates[request.id] = .pending\n'
              '        pendingWriteAuditContexts[request.id] = operationContext\n'
              '        let continuationBox = CatalogWriteAccessContinuationBox()\n'
              '        writeAccessContinuations[request.id] = continuationBox\n',
              '        let continuationBox = writeAccessLifecycle.insert(\n'
              '            request,\n'
              '            auditContext: operationContext\n'
              '        )\n',
              'request insertion'
          )

          replace_once(
              '        defer {\n'
              '            timeoutTask?.cancel()\n'
              '            pendingWriteAccessRequests.removeValue(forKey: request.id)\n'
              '            writeAccessContinuations.removeValue(forKey: request.id)\n'
              '            pendingWriteAuditContexts.removeValue(forKey: request.id)\n'
              '            pruneWriteAccessStates()\n'
              '        }\n',
              '        defer {\n'
              '            timeoutTask?.cancel()\n'
              '            writeAccessLifecycle.cleanup(id: request.id)\n'
              '        }\n',
              'request cleanup'
          )

          replace_once(
              '            guard let boundIntent = pendingWriteAccessRequests[request.id]?.intent else {\n',
              '            guard let boundIntent = writeAccessLifecycle.intent(for: request.id) else {\n',
              'bound intent'
          )
          replace_once(
              '            writeAccessStates[request.id] = .consumed\n',
              '            writeAccessLifecycle.markConsumed(id: request.id)\n',
              'consumed state'
          )
          replace_once(
              '                writeAccessStates[request.id] = .cancelled\n',
              '                writeAccessLifecycle.markCancelled(id: request.id)\n',
              'cancelled catch state'
          )
          replace_once(
              '            if writeAccessStates[request.id] == .expired {\n',
              '            if writeAccessLifecycle.state(for: request.id) == .expired {\n',
              'expired catch check'
          )

          replace_once(
              '    public func pendingCatalogWriteAccessRequest(id: UUID) async throws -> CatalogAgentWriteAccessRequest {\n'
              '        guard let request = pendingWriteAccessRequests[id],\n'
              '              writeAccessStates[id] == .pending || writeAccessStates[id] == .authenticating\n'
              '        else {\n'
              '            throw SecretCatalogAgentError.invalidOperation\n'
              '        }\n'
              '        return request\n'
              '    }\n',
              '    public func pendingCatalogWriteAccessRequest(id: UUID) async throws -> CatalogAgentWriteAccessRequest {\n'
              '        guard let request = writeAccessLifecycle.pendingRequest(id: id) else {\n'
              '            throw SecretCatalogAgentError.invalidOperation\n'
              '        }\n'
              '        return request\n'
              '    }\n',
              'pending request lookup'
          )

          replace_once(
              '    public func pendingCatalogWriteAccessRequestIDs() async throws -> [UUID] {\n'
              '        pendingWriteAccessRequests.keys\n'
              '            .filter { writeAccessStates[$0] == .pending || writeAccessStates[$0] == .authenticating }\n'
              '            .sorted { lhs, rhs in\n'
              '                (pendingWriteAccessRequests[lhs]?.createdAt ?? "") <\n'
              '                    (pendingWriteAccessRequests[rhs]?.createdAt ?? "")\n'
              '            }\n'
              '    }\n',
              '    public func pendingCatalogWriteAccessRequestIDs() async throws -> [UUID] {\n'
              '        writeAccessLifecycle.pendingRequestIDs\n'
              '    }\n',
              'pending request ids'
          )

          replace_once(
              '        guard let request = pendingWriteAccessRequests[id],\n'
              '              writeAccessStates[id] == .pending,\n'
              '              let continuation = writeAccessContinuations[id]\n'
              '        else {\n'
              '            throw SecretCatalogAgentError.invalidOperation\n'
              '        }\n'
              '        let originalContext = pendingWriteAuditContexts[id]\n',
              '        guard let snapshot = writeAccessLifecycle.responseSnapshot(id: id) else {\n'
              '            throw SecretCatalogAgentError.invalidOperation\n'
              '        }\n'
              '        let request = snapshot.request\n'
              '        let continuation = snapshot.continuation\n'
              '        let originalContext = snapshot.auditContext\n',
              'response snapshot'
          )

          replace_once(
              '            writeAccessStates[id] = .denied\n'
              '            continuation.resume(throwing: SecretCatalogAgentError.agentWriteNotAllowed)\n',
              '            writeAccessLifecycle.markDenied(id: id)\n'
              '            continuation.resume(throwing: SecretCatalogAgentError.agentWriteNotAllowed)\n',
              'explicit denial'
          )
          replace_once(
              '        writeAccessStates[id] = .authenticating\n',
              '        _ = writeAccessLifecycle.markAuthenticating(id: id)\n',
              'authenticating state'
          )
          replace_once(
              '            guard writeAccessStates[id] == .authenticating,\n',
              '            guard writeAccessLifecycle.state(for: id) == .authenticating,\n',
              'authenticating check'
          )
          replace_once(
              '            writeAccessStates[id] = .approved\n',
              '            writeAccessLifecycle.markApproved(id: id)\n',
              'approved state'
          )

          denied_assignment = '            writeAccessStates[id] = .denied\n'
          if text.count(denied_assignment) != 2:
              raise SystemExit(f'catch denied states: expected 2 matches, got {text.count(denied_assignment)}')
          text = text.replace(
              denied_assignment,
              '            writeAccessLifecycle.markDenied(id: id)\n'
          )

          expire_start = text.index('    private func expireCatalogWriteAccessRequest(id: UUID) {')
          prune_end = text.index('    public func catalogCreateIndex(', expire_start)
          old_terminal = text[expire_start:prune_end]
          new_terminal = (
              '    private func expireCatalogWriteAccessRequest(id: UUID) {\n'
              '        guard let continuation = writeAccessLifecycle.markExpiredIfActive(id: id) else { return }\n'
              '        Task { await catalogAgentWriteAuthorization.revoke(requestID: id) }\n'
              '        writeAccessNotifier.notifyQueueChanged(requestID: id)\n'
              '        continuation.resume(throwing: VaultAppServicesRevealError.revealUnavailable)\n'
              '    }\n\n'
              '    private func cancelCatalogWriteAccessRequest(id: UUID) {\n'
              '        guard let continuation = writeAccessLifecycle.markCancelledIfActive(id: id) else { return }\n'
              '        Task { await catalogAgentWriteAuthorization.revoke(requestID: id) }\n'
              '        writeAccessNotifier.notifyQueueChanged(requestID: id)\n'
              '        continuation.resume(throwing: CancellationError())\n'
              '    }\n\n'
          )
          text = text[:expire_start] + new_terminal + text[prune_end:]

          forbidden = [
              'pendingWriteAccessRequests',
              'writeAccessContinuations',
              'writeAccessStates',
              'pendingWriteAuditContexts',
              'pruneWriteAccessStates'
          ]
          leftovers = [name for name in forbidden if name in text]
          if leftovers:
              raise SystemExit('old write-access state owners remain: ' + ', '.join(leftovers))

          path.write_text(text)

          budget = Path('scripts/check-architecture-budgets.sh')
          budget_text = budget.read_text()
          actual = len(text.encode())
          old_budget = 'Sources/VaultService/VaultAppServices.swift:262412'
          new_budget = f'Sources/VaultService/VaultAppServices.swift:{actual}'
          if budget_text.count(old_budget) != 1:
              raise SystemExit('expected current VaultAppServices budget exactly once')
          budget.write_text(budget_text.replace(old_budget, new_budget, 1))
          print(f'VaultAppServices.swift architecture ceiling -> {actual} bytes')
          PY

      - name: Regenerate Xcode project without target-order noise
        run: |
          cp SVLT.xcodeproj/project.pbxproj /tmp/svlt-before-write-access.pbxproj
          xcodegen generate --quiet --spec project.yml --project . --project-root . --cache-path /tmp/svlt-xcodegen-cache
          python3 <<'PY'
          from pathlib import Path
          import re

          before = Path('/tmp/svlt-before-write-access.pbxproj').read_text()
          generated_path = Path('SVLT.xcodeproj/project.pbxproj')
          generated = generated_path.read_text()
          pattern = re.compile(r'(\n\s*targets\s*=\s*\(\n)(.*?)(\n\s*\);)', re.S)
          old_match = pattern.search(before)
          new_match = pattern.search(generated)
          if old_match is None or new_match is None:
              raise SystemExit('unable to locate PBXProject targets block')
          generated = generated[:new_match.start(2)] + old_match.group(2) + generated[new_match.end(2):]
          generated_path.write_text(generated)
          PY

      - name: Verify extraction
        run: |
          bash scripts/check-xcodegen-parity.sh
          bash scripts/check-architecture-budgets.sh
          git diff --check

      - name: Commit extraction
        run: |
          git config user.name 'zyk1172'
          git config user.email '53221608+zyk1172@users.noreply.github.com'
          git add Sources/VaultService/VaultAppServices.swift \
                  scripts/check-architecture-budgets.sh \
                  SVLT.xcodeproj/project.pbxproj
          if git diff --cached --quiet; then
            echo 'No extraction changes to commit.'
            exit 0
          fi
          git commit -m 'refactor: delegate write access lifecycle state'
          git push
