name: Temporary audit health project cleanup

on:
  push:
    branches:
      - codex/extract-audit-health-owner

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/extract-audit-health-owner
          fetch-depth: 0
      - name: Restore presentation-only target order
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          path = Path("SVLT.xcodeproj/project.pbxproj")
          current = path.read_text()
          base = subprocess.check_output(
              ["git", "show", "origin/main:SVLT.xcodeproj/project.pbxproj"],
              text=True,
          )
          pattern = re.compile(r"\n\t\t\ttargets = \(\n.*?\n\t\t\t\);", re.S)
          current_matches = pattern.findall(current)
          base_matches = pattern.findall(base)
          assert len(current_matches) == 1
          assert len(base_matches) == 1
          current = current.replace(current_matches[0], base_matches[0], 1)
          path.write_text(current)
          PY
          git diff --check
      - name: Verify project parity
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          ./scripts/check-xcodegen-parity.sh
      - name: Commit project cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SVLT.xcodeproj/project.pbxproj
          git diff --cached --exit-code && exit 1 || true
          git commit -m "chore: keep Xcode target ordering stable"
          git push origin HEAD:codex/extract-audit-health-owner
