name: Repair PR 85 verification workflow

on:
  push:
    branches: [codex/approval-2m-unbounded-execution]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/approval-2m-unbounded-execution
          fetch-depth: 0
      - name: Repair exact matcher
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/fix-pr85-review.yml')
          text = path.read_text()
          text = text.replace("    if: github.actor != 'github-actions[bot]'\n", "")
          old = """              '''private func runFTPStage<T: Sendable>(
                  operation: @escaping @Sendable () async throws -> T
              ) async throws -> T {
                  try Task.checkCancellation()
                  return try await operation()
              }''',
              '''func runFTPStage<T: Sendable>(
                  operation: @escaping @Sendable () async throws -> T
              ) async throws -> T {
                  try Task.checkCancellation()
                  do {
                      let result = try await operation()
                      try Task.checkCancellation()
                      return result
                  } catch {
                      try Task.checkCancellation()
                      throw error
                  }
              }''',"""
          new = """              'private func runFTPStage<T: Sendable>(\\n    operation: @escaping @Sendable () async throws -> T\\n) async throws -> T {\\n    try Task.checkCancellation()\\n    return try await operation()\\n}',
              'func runFTPStage<T: Sendable>(\\n    operation: @escaping @Sendable () async throws -> T\\n) async throws -> T {\\n    try Task.checkCancellation()\\n    do {\\n        let result = try await operation()\\n        try Task.checkCancellation()\\n        return result\\n    } catch {\\n        try Task.checkCancellation()\\n        throw error\\n    }\\n}',"""
          if text.count(old) != 1:
              raise SystemExit(f'workflow matcher repair expected one match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit repair and self-delete
        run: |
          git rm .github/workflows/repair-pr85-workflow.yml
          git add .github/workflows/fix-pr85-review.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore: repair PR 85 verification workflow'
          git push origin HEAD:codex/approval-2m-unbounded-execution
