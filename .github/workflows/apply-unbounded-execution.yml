name: Apply unbounded execution refactor

on:
  push:
    branches:
      - codex/approval-2m-unbounded-execution

permissions:
  contents: write

jobs:
  refactor-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/approval-2m-unbounded-execution
          fetch-depth: 0

