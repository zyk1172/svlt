              text = p.read_text()
              found = text.count(old)
              expected = count if count is not None else 1
              if found != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences of {old!r}, found {found}')
              p.write_text(text.replace(old, new, expected))

          def regex_replace(path, pattern, repl, count=1, flags=0):
              p = Path(path)
              text = p.read_text()
              updated, n = re.subn(pattern, repl, text, count=count, flags=flags)
              if n != count:
                  raise SystemExit(f'{path}: expected {count} regex replacements for {pattern!r}, found {n}')
              p.write_text(updated)

