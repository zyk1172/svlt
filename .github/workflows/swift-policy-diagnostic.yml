name: Swift policy diagnostic

on:
  push:
    branches: [codex/intent-first-authorization]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: svlt-swift-policy-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[policy-diag-result]') }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run VaultAuthorization tests and capture diagnostics
        shell: bash
        run: |
          set -o pipefail
          set +e
          xcodebuild test \
            -project SVLT.xcodeproj \
            -scheme AgentSecretVault \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/svlt-policy-diag-derived" \
            -parallel-testing-enabled NO \
            -only-testing:VaultAuthorizationTests \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/policy-diag.log"
          status=${PIPESTATUS[0]}
          set -e

          python3 - "$RUNNER_TEMP/policy-diag.log" "$status" <<'PY'
          import re, sys
          from pathlib import Path
          src = Path(sys.argv[1])
          status = int(sys.argv[2])
          lines = src.read_text(errors='replace').splitlines()
          patterns = re.compile(r'(error:|failed|failure|recorded an issue|Expectation failed|✘|Test .* failed)', re.I)
          hits = [i for i, line in enumerate(lines) if patterns.search(line)]
          selected = set()
          for i in hits:
              selected.update(range(max(0, i - 8), min(len(lines), i + 16)))
          if not selected:
              selected.update(range(max(0, len(lines) - 400), len(lines)))
          out = [f'xcodebuild_status={status}', '']
          previous = None
          for i in sorted(selected):
              if previous is not None and i > previous + 1:
                  out.append('...')
              out.append(f'{i+1:06d}: {lines[i]}')
              previous = i
          Path('swift-policy-diagnostic.txt').write_text('\n'.join(out) + '\n')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add swift-policy-diagnostic.txt
          git commit -m 'chore: capture Swift policy diagnostics [policy-diag-result]'
          git push
