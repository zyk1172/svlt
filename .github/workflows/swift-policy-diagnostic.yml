name: Apply Swift policy diagnostic fix

on:
  push:
    branches: [codex/intent-first-authorization]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: svlt-swift-policy-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[policy-diag-fix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Apply narrow implementation fix and remove diagnostics
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('Sources/VaultAuthorization/SecretOperationPolicyEngine.swift')
          text = path.read_text()
          old = '''        var effectiveRequirement = local.authorizationRequirement
        var reasons = local.reasons
        let semantic = descriptor.agentAssessment

        if local.authorizationRequirement != .denied,
           !local.technicalFailure,
           !descriptor.secretReferences.isEmpty {
'''
          new = '''        var effectiveRequirement = local.authorizationRequirement
        var reasons = local.reasons
        let semantic = descriptor.agentAssessment
        let semanticParticipated = local.authorizationRequirement != .denied
            && !local.technicalFailure
            && !descriptor.secretReferences.isEmpty

        if semanticParticipated {
'''
          if old not in text:
              raise SystemExit('semantic participation block not found')
          text = text.replace(old, new, 1)

          old_rule = '''            policyRuleID: descriptor.secretReferences.isEmpty
                ? local.policyRuleID
                : "\\(local.policyRuleID)+intent-first",
'''
          new_rule = '''            policyRuleID: semanticParticipated
                ? "\\(local.policyRuleID)+intent-first"
                : local.policyRuleID,
'''
          if old_rule not in text:
              raise SystemExit('policy rule label block not found')
          text = text.replace(old_rule, new_rule, 1)
          path.write_text(text)
          PY

          rm -f swift-policy-diagnostic.txt
          rm -f .github/workflows/swift-policy-diagnostic.yml

          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: label only semantic authorization decisions [policy-diag-fix]'
          git push
