name: Apply operation lifecycle refactor

on:
  push:
    branches:
      - codex/operation-id-lifecycle
    paths:
      - 'scripts/apply-operation-lifecycle-refactor.trigger*'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic refactor
        run: |
          python3 scripts/prepare-operation-lifecycle-refactor.py
          python3 scripts/apply-operation-lifecycle-refactor.py
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Regenerate project
        run: xcodegen generate
      - name: Validate architecture and whitespace
        run: |
          bash scripts/check-architecture-budgets.sh
          git diff --check
      - name: Run macOS tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project SVLT.xcodeproj \
            -scheme AgentSecretVault \
            -destination 'platform=macOS' \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/operation-lifecycle-xcodebuild.log"
      - name: Commit validated refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Sources Tests scripts/check-architecture-budgets.sh SVLT.xcodeproj/project.pbxproj
          git commit -m 'refactor: add operationID lifecycle' \
            -m 'Introduce start/status/cancel operation tracking with conservative outcomeUnknown cancellation semantics while preserving the synchronous execution API.'
          git push
