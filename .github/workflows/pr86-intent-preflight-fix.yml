name: Apply PR86 authorization review fixes

on:
  push:
    branches: [codex/intent-first-authorization]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/intent-first-authorization
          fetch-depth: 0
      - name: Apply intent-first preflight architecture
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()
          def write(path, text):
              Path(path).write_text(text)
          def rep(path, old, new, count=1):
              text = read(path)
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f"{path}: expected at least {count} matches, got {actual}: {old[:120]!r}")
              text = text.replace(old, new, count)
              write(path, text)
          def insert_before(path, marker, addition):
              text = read(path)
              if marker not in text:
                  raise SystemExit(f"{path}: marker not found: {marker[:120]!r}")
              write(path, text.replace(marker, addition + marker, 1))

          # 1) Swift model: truly conservative defaults + daemon preflight wire model.
          p = 'Sources/VaultCore/Models/SecretOperation.swift'
          rep(p, 'intentAlignment: IntentAlignment = .direct,\n        effectSeverity: EffectSeverity = .bounded,\n        reversibility: Reversibility = .recoverable,\n        secretHandling: SecretHandling = .credentialUse,\n        executionRecommendation: ExecutionRecommendation = .reusableApproval,\n        confidence: Double = 0.90',
                 'intentAlignment: IntentAlignment = .unclear,\n        effectSeverity: EffectSeverity = .unknown,\n        reversibility: Reversibility = .unknown,\n        secretHandling: SecretHandling = .unknown,\n        executionRecommendation: ExecutionRecommendation = .uncertain,\n        confidence: Double = 0')
          rep(p, 'executionRecommendation: .reusableApproval,\n        confidence: 0\n    )\n}\n\npublic enum SecretOperationAction',
                 'executionRecommendation: .uncertain,\n        confidence: 0\n    )\n}\n\npublic struct SecretOperationPreflight: Codable, Equatable, Sendable {\n    public enum Route: String, Codable, CaseIterable, Sendable {\n        case fast\n        case hard\n        case gray\n        case denied\n    }\n\n    public enum BlastRadius: String, Codable, CaseIterable, Sendable {\n        case none\n        case tiny\n        case bounded\n        case broad\n        case systemic\n        case unknown\n    }\n\n    public let route: Route\n    public let policyRuleID: String\n    public let authorizationRequirement: AuthorizationRequirement\n    public let blastRadius: BlastRadius\n    public let reasons: [String]\n    public let technicalFailure: Bool\n\n    public init(\n        route: Route,\n        policyRuleID: String,\n        authorizationRequirement: AuthorizationRequirement,\n        blastRadius: BlastRadius,\n        reasons: [String],\n        technicalFailure: Bool = false\n    ) {\n        self.route = route\n        self.policyRuleID = policyRuleID\n        self.authorizationRequirement = authorizationRequirement\n        self.blastRadius = blastRadius\n        self.reasons = reasons\n        self.technicalFailure = technicalFailure\n    }\n}\n\npublic enum SecretOperationAction')

          # 2) Policy engine: local deterministic preflight before semantic judge.
          p = 'Sources/VaultAuthorization/SecretOperationPolicyEngine.swift'
          marker = '    public func evaluate(\n        _ descriptor: SecretOperationDescriptor,\n        metadata: [SecretPolicyMetadata]\n    ) -> PolicyDecision {'
          addition = '''    public func semanticPreflight(
        _ descriptor: SecretOperationDescriptor,
        metadata: [SecretPolicyMetadata]
    ) -> SecretOperationPreflight {
        let normalizedDestination = descriptor.normalizedDestination
        let local = localDecision(
            descriptor,
            metadata: metadata,
            normalizedDestination: normalizedDestination
        )
        if local.authorizationRequirement == .denied || local.technicalFailure {
            return SecretOperationPreflight(
                route: .denied,
                policyRuleID: local.policyRuleID,
                authorizationRequirement: .denied,
                blastRadius: .unknown,
                reasons: local.reasons,
                technicalFailure: true
            )
        }

        let semantic = descriptor.agentAssessment
        let blastRadius = Self.blastRadius(for: semantic, ruleID: local.policyRuleID)
        if local.authorizationRequirement == .freshApprovalRequired,
           Self.isNonDowngradableFreshRule(local.policyRuleID) {
            return SecretOperationPreflight(
                route: .hard,
                policyRuleID: local.policyRuleID,
                authorizationRequirement: .freshApprovalRequired,
                blastRadius: blastRadius,
                reasons: local.reasons
            )
        }
        if semantic.executionRecommendation == .freshApproval {
            return SecretOperationPreflight(
                route: .hard,
                policyRuleID: local.policyRuleID,
                authorizationRequirement: .freshApprovalRequired,
                blastRadius: blastRadius,
                reasons: local.reasons + ["Main Agent already requests fresh approval"]
            )
        }

        let binding = bindingDecision(
            descriptor,
            metadata: metadata,
            normalizedDestination: normalizedDestination
        )
        let semanticUnresolved = semantic.executionRecommendation == .uncertain
            || semantic.intentAlignment == .unclear
            || semantic.intentAlignment == .unrelated
            || semantic.effectSeverity == .unknown
            || semantic.reversibility == .unknown
            || semantic.secretHandling == .unknown
        let semanticConflict = semantic.executionRecommendation == .automatic
            && Self.automaticRecommendationNeedsReview(semantic)
        let localConflict = semantic.executionRecommendation == .automatic
            && Self.isSemanticGrayRule(local.policyRuleID)
        let scopeConflict = semantic.executionRecommendation == .automatic
            && !binding.reasons.isEmpty
        let opaqueExecution = Self.looksSemanticallyOpaque(descriptor)

        if semanticUnresolved || semanticConflict || localConflict || scopeConflict || opaqueExecution {
            var reasons = local.reasons
            if semanticUnresolved { reasons.append("语义字段仍有未决项") }
            if semanticConflict { reasons.append("主模型 automatic 建议与高影响语义冲突") }
            if localConflict { reasons.append("本地分类器检测到需要独立语义复核的操作族") }
            if scopeConflict { reasons.append("凭据执行目标或协议超出既有绑定范围") }
            if opaqueExecution { reasons.append("操作包含动态或不透明执行") }
            return SecretOperationPreflight(
                route: .gray,
                policyRuleID: local.policyRuleID,
                authorizationRequirement: .freshApprovalRequired,
                blastRadius: blastRadius,
                reasons: reasons
            )
        }

        return SecretOperationPreflight(
            route: .fast,
            policyRuleID: local.policyRuleID,
            authorizationRequirement: Self.normalizedSemanticRequirement(semantic),
            blastRadius: blastRadius,
            reasons: local.reasons
        )
    }

'''
          insert_before(p, marker, addition)
          rep(p, 'localRequirement = descriptor.actionType == .exportPlaintext\n                ? .reusableApproval\n                : .freshApprovalRequired', 'localRequirement = .freshApprovalRequired')
          rep(p,
              '''            if local.authorizationRequirement == .freshApprovalRequired,
               Self.isNonDowngradableFreshRule(local.policyRuleID) {
                effectiveRequirement = .freshApprovalRequired
            } else {
                effectiveRequirement = semantic.executionRecommendation.authorizationRequirement
            }''',
              '''            let preflight = semanticPreflight(descriptor, metadata: metadata)
            if local.authorizationRequirement == .freshApprovalRequired,
               Self.isNonDowngradableFreshRule(local.policyRuleID) {
                effectiveRequirement = .freshApprovalRequired
            } else if preflight.route == .gray,
                      semantic.source == .mainAgent,
                      semantic.executionRecommendation == .automatic {
                // A main-Agent automatic recommendation may not bypass a
                // deterministic gray-zone signal. The MCP boundary must first
                // obtain an independent judgment; direct IPC fails closed.
                effectiveRequirement = .freshApprovalRequired
            } else {
                effectiveRequirement = Self.normalizedSemanticRequirement(semantic)
            }''')
          marker = '    private static func isNonDowngradableFreshRule(_ ruleID: String) -> Bool {'
          helpers = '''    private static func normalizedSemanticRequirement(
        _ assessment: AgentRiskAssessment
    ) -> AuthorizationRequirement {
        if assessment.executionRecommendation == .automatic,
           automaticRecommendationNeedsReview(assessment) {
            return .freshApprovalRequired
        }
        return assessment.executionRecommendation.authorizationRequirement
    }

    private static func automaticRecommendationNeedsReview(_ assessment: AgentRiskAssessment) -> Bool {
        assessment.intentAlignment == .unclear
            || assessment.intentAlignment == .unrelated
            || assessment.effectSeverity == .broad
            || assessment.effectSeverity == .systemic
            || assessment.effectSeverity == .unknown
            || assessment.reversibility == .difficult
            || assessment.reversibility == .irreversible
            || assessment.reversibility == .unknown
            || assessment.secretHandling == .thirdPartyExposure
            || assessment.secretHandling == .plaintextSecretExposure
            || assessment.secretHandling == .unknown
    }

    private static func isSemanticGrayRule(_ ruleID: String) -> Bool {
        [
            SSHFreshRules.filesystemDelete,
            SSHFreshRules.containerDestruction,
            HTTPFreshRules.delete,
            DatabaseFreshRules.destructiveWrite,
            DatabaseFreshRules.dynamicExecution,
            DatabaseFreshRules.unknown,
            SFTPFreshRules.delete,
            SFTPFreshRules.overwriteExisting,
            SFTPFreshRules.replaceExistingTarget
        ].contains(ruleID)
    }

    private static func blastRadius(
        for assessment: AgentRiskAssessment,
        ruleID: String
    ) -> SecretOperationPreflight.BlastRadius {
        if [SSHFreshRules.powerControl, SSHFreshRules.blockDeviceFilesystem, SSHFreshRules.storageRaidDestruction].contains(ruleID) {
            return .systemic
        }
        if [DatabaseFreshRules.destructiveStructure, DatabaseFreshRules.privilegeAccountAdmin].contains(ruleID) {
            return .broad
        }
        if isSemanticGrayRule(ruleID) {
            return assessment.effectSeverity == .systemic ? .systemic
                : assessment.effectSeverity == .broad ? .broad
                : .unknown
        }
        switch assessment.effectSeverity {
        case .none: return .none
        case .minor: return .tiny
        case .bounded: return .bounded
        case .broad: return .broad
        case .systemic: return .systemic
        case .unknown: return .unknown
        }
    }

    private static func looksSemanticallyOpaque(_ descriptor: SecretOperationDescriptor) -> Bool {
        let components: [String] = [descriptor.command, descriptor.databaseStatement].compactMap { $0 }
            + (descriptor.sshCommandBatch?.commands.flatMap { [$0.executable] + $0.arguments } ?? [])
        let text = components.joined(separator: "\\n").lowercased()
        guard !text.isEmpty else { return false }
        if text.contains("curl ") && (text.contains("| sh") || text.contains("| bash") || text.contains("| zsh")) { return true }
        if text.contains("wget ") && (text.contains("| sh") || text.contains("| bash") || text.contains("| zsh")) { return true }
        if text.contains("eval ") || text.contains("execute immediate") { return true }
        if text.contains("base64") && (text.contains("| sh") || text.contains("| bash") || text.contains("| zsh")) { return true }
        return false
    }

'''
          insert_before(p, marker, helpers)

          # 3) Swift IPC preflight request/response.
          p = 'Sources/VaultIPC/IPCMessage.swift'
          rep(p, '    case executeSecretOperation(SecretOperationDescriptor)\n    case startSecretOperation(SecretOperationDescriptor)',
                 '    case preflightSecretOperation(SecretOperationDescriptor)\n    case executeSecretOperation(SecretOperationDescriptor)\n    case startSecretOperation(SecretOperationDescriptor)')
          rep(p, '        case executeSecretOperation\n        case startSecretOperation',
                 '        case preflightSecretOperation\n        case executeSecretOperation\n        case startSecretOperation')
          rep(p, '        case .executeSecretOperation:\n            self = .executeSecretOperation(try container.decode(SecretOperationDescriptor.self, forKey: .descriptor))',
                 '        case .preflightSecretOperation:\n            self = .preflightSecretOperation(try container.decode(SecretOperationDescriptor.self, forKey: .descriptor))\n        case .executeSecretOperation:\n            self = .executeSecretOperation(try container.decode(SecretOperationDescriptor.self, forKey: .descriptor))')
          rep(p, '        case let .executeSecretOperation(descriptor):\n            try container.encode(RequestType.executeSecretOperation, forKey: .type)',
                 '        case let .preflightSecretOperation(descriptor):\n            try container.encode(RequestType.preflightSecretOperation, forKey: .type)\n            try container.encode(descriptor, forKey: .descriptor)\n        case let .executeSecretOperation(descriptor):\n            try container.encode(RequestType.executeSecretOperation, forKey: .type)')
          rep(p, '    case secretOperation(SecretOperationOutput)\n    case secretOperationHandle(SecretOperationHandle)',
                 '    case secretOperation(SecretOperationOutput)\n    case secretOperationPreflight(SecretOperationPreflight)\n    case secretOperationHandle(SecretOperationHandle)')
          rep(p, '        case secretOperation\n        case secretOperationHandle',
                 '        case secretOperation\n        case secretOperationPreflight\n        case secretOperationHandle')
          rep(p, '        case .secretOperation:\n            self = .secretOperation(try container.decode(SecretOperationOutput.self, forKey: .output))',
                 '        case .secretOperation:\n            self = .secretOperation(try container.decode(SecretOperationOutput.self, forKey: .output))\n        case .secretOperationPreflight:\n            self = .secretOperationPreflight(try container.decode(SecretOperationPreflight.self, forKey: .result))')
          rep(p, '        case let .secretOperation(output):\n            try container.encode(ResponseType.secretOperation, forKey: .type)',
                 '        case let .secretOperation(output):\n            try container.encode(ResponseType.secretOperation, forKey: .type)')
          # Insert response encoder branch immediately before handle branch.
          rep(p, '        case let .secretOperationHandle(handle):\n            try container.encode(ResponseType.secretOperationHandle, forKey: .type)',
                 '        case let .secretOperationPreflight(preflight):\n            try container.encode(ResponseType.secretOperationPreflight, forKey: .type)\n            try container.encode(preflight, forKey: .result)\n        case let .secretOperationHandle(handle):\n            try container.encode(ResponseType.secretOperationHandle, forKey: .type)')

          # 4) IPC handler + concrete app service.
          p = 'Sources/VaultIPC/IPCRequestHandler.swift'
          rep(p, '    func performSecretOperation(_ descriptor: SecretOperationDescriptor) async throws -> SecretOperationOutput',
                 '    func preflightSecretOperation(_ descriptor: SecretOperationDescriptor) async throws -> SecretOperationPreflight\n    func performSecretOperation(_ descriptor: SecretOperationDescriptor) async throws -> SecretOperationOutput')
          rep(p, '    func performSecretOperation(_: SecretOperationDescriptor) async throws -> SecretOperationOutput {\n        throw IPCRequestHandlerError.unsupportedRequest\n    }',
                 '    func preflightSecretOperation(_: SecretOperationDescriptor) async throws -> SecretOperationPreflight {\n        throw IPCRequestHandlerError.unsupportedRequest\n    }\n\n    func performSecretOperation(_: SecretOperationDescriptor) async throws -> SecretOperationOutput {\n        throw IPCRequestHandlerError.unsupportedRequest\n    }')
          rep(p, '        case let .executeSecretOperation(descriptor):\n            do {',
                 '        case let .preflightSecretOperation(descriptor):\n            do {\n                return .secretOperationPreflight(try await service.preflightSecretOperation(descriptor))\n            } catch let error as SecretOperationError {\n                return .failure(code: error.responseCode)\n            } catch {\n                return .failure(code: "ACTION_EXECUTION_FAILED")\n            }\n        case let .executeSecretOperation(descriptor):\n            do {')

          p = 'Sources/VaultService/VaultAppServices.swift'
          marker = '    public func performSecretOperation(\n        _ descriptor: SecretOperationDescriptor\n    ) async throws -> SecretOperationOutput {'
          addition = '''    public func preflightSecretOperation(
        _ descriptor: SecretOperationDescriptor
    ) async throws -> SecretOperationPreflight {
        let metadata = try await policyMetadata(for: descriptor.secretReferences)
        return operationPolicyEngine.semanticPreflight(descriptor, metadata: metadata)
    }

'''
          insert_before(p, marker, addition)

          # 5) TypeScript protocol mirrors the daemon preflight.
          p = 'mcp-server/src/protocol.ts'
          marker = '// This is display-only metadata supplied by the MCP client.'
          addition = '''export const SecretOperationPreflight = z.object({
  route: z.enum(["fast", "hard", "gray", "denied"]),
  policyRuleID: z.string().min(1),
  authorizationRequirement: z.enum(["none", "reusableApproval", "freshApprovalRequired", "denied"]),
  blastRadius: z.enum(["none", "tiny", "bounded", "broad", "systemic", "unknown"]),
  reasons: z.array(z.string()),
  technicalFailure: z.boolean()
}).strict();
export type SecretOperationPreflight = z.infer<typeof SecretOperationPreflight>;

'''
          insert_before(p, marker, addition)
          rep(p, '  z\n    .object({\n      type: z.literal("executeSecretOperation"),\n      descriptor: SecretOperationDescriptor\n    })',
                 '  z\n    .object({\n      type: z.literal("preflightSecretOperation"),\n      descriptor: SecretOperationDescriptor\n    })\n    .strict(),\n  z\n    .object({\n      type: z.literal("executeSecretOperation"),\n      descriptor: SecretOperationDescriptor\n    })')
          # Response union insertion anchored on secretOperation response.
          rep(p, '  z.object({ type: z.literal("secretOperation"), output: SecretOperationOutput }).strict(),',
                 '  z.object({ type: z.literal("secretOperation"), output: SecretOperationOutput }).strict(),\n  z.object({ type: z.literal("secretOperationPreflight"), result: SecretOperationPreflight }).strict(),')

          # 6) Two-phase client: daemon preflight first, judge only for gray.
          p = 'mcp-server/src/client.ts'
          rep(p, '    const riskJudgedRequest = await applyContextBoundedRiskJudge(request);\n    const parsedRequest = LifecycleIpcRequest.parse(riskJudgedRequest);\n    const effectiveCaller = caller ?? this.declaredCaller;',
                 '''    const initialRequest = LifecycleIpcRequest.parse(request);
    const effectiveCaller = caller ?? this.declaredCaller;
    let parsedRequest = initialRequest;
    if (initialRequest.type === "executeSecretOperation" || initialRequest.type === "startSecretOperation") {
      const preflightResponse = await this.requestRaw({
        type: "preflightSecretOperation",
        descriptor: initialRequest.descriptor
      }, effectiveCaller);
      if (preflightResponse.type === "failure") {
        return preflightResponse as BaseIpcResponse;
      }
      if (preflightResponse.type !== "secretOperationPreflight") {
        throw new Error("SVLT daemon returned an invalid preflight response");
      }
      parsedRequest = LifecycleIpcRequest.parse(
        await applyContextBoundedRiskJudge(initialRequest, preflightResponse.result)
      );
    }''')

          # 7) Risk judge consumes daemon signals; TypeScript no longer invents policy routing.
          p = 'mcp-server/src/risk-judge.ts'
          text = read(p)
          text = text.replace('import type { AgentRiskAssessment, SecretOperationDescriptor } from "./protocol.js";',
                              'import type { AgentRiskAssessment, SecretOperationDescriptor, SecretOperationPreflight } from "./protocol.js";')
          start = text.index('export async function applyContextBoundedRiskJudge(')
          end = text.index('async function judgeOperation(', start)
          replacement = '''export async function applyContextBoundedRiskJudge(
  request: IpcRequest,
  preflight: SecretOperationPreflight,
  configuration: RiskJudgeConfiguration | undefined = riskJudgeConfigurationFromEnvironment(),
  transport: RiskJudgeTransport = defaultTransport
): Promise<IpcRequest> {
  if (request.type !== "executeSecretOperation" && request.type !== "startSecretOperation") return request;

  const main = normalizeAssessment({ ...request.descriptor.agentAssessment, source: "mainAgent" });
  if (preflight.route === "denied") return replaceAssessment(request, main);
  if (preflight.route === "hard") {
    return replaceAssessment(request, normalizeAssessment({
      ...main,
      executionRecommendation: "freshApproval"
    }));
  }
  if (preflight.route === "fast") return replaceAssessment(request, main);

  if (configuration === undefined) {
    return replaceAssessment(request, normalizeAssessment({
      ...main,
      source: "mainAgent",
      reason: `Independent semantic review required but not configured: ${preflight.policyRuleID}`,
      executionRecommendation: "freshApproval",
      confidence: 0
    }));
  }

  try {
    const judged = await judgeOperation(request.descriptor, main, preflight, configuration, transport);
    return replaceAssessment(request, normalizeAssessment({
      ...main,
      ...judged,
      source: "independentJudge"
    }));
  } catch {
    return replaceAssessment(request, normalizeAssessment({
      ...main,
      source: "independentJudge",
      reason: "Independent semantic judge unavailable or returned an invalid response",
      effectSeverity: "unknown",
      reversibility: "unknown",
      secretHandling: "unknown",
      intentAlignment: "unclear",
      executionRecommendation: "freshApproval",
      confidence: 0
    }));
  }
}

'''
          text = text[:start] + replacement + text[end:]
          text = text.replace('  grayReason: string,\n  configuration: RiskJudgeConfiguration,', '  preflight: SecretOperationPreflight,\n  configuration: RiskJudgeConfiguration,')
          text = text.replace('      svltSignals: {\n        grayReason,\n        operatingPrinciple:', '      svltSignals: {\n        route: preflight.route,\n        localRuleID: preflight.policyRuleID,\n        localRequirement: preflight.authorizationRequirement,\n        blastRadius: preflight.blastRadius,\n        reasons: preflight.reasons.slice(0, 12).map((reason) => safeContextText(reason, 1_024)),\n        operatingPrinciple:')
          # Remove now-dead TS-only routing helpers.
          for fn in ['function semanticGrayReason(', 'function isClearlyHighImpact(', 'function looksSemanticallyOpaque(']:
              while fn in text:
                  s = text.index(fn)
                  # find balanced function braces
                  brace = text.index('{', s)
                  depth = 0
                  i = brace
                  while i < len(text):
                      if text[i] == '{': depth += 1
                      elif text[i] == '}':
                          depth -= 1
                          if depth == 0:
                              i += 1
                              while i < len(text) and text[i] in '\r\n': i += 1
                              text = text[:s] + text[i:]
                              break
                      i += 1
                  else:
                      raise SystemExit(f'failed to remove {fn}')
          # Normalize only judge-output contradictions here; daemon owns local route.
          text = text.replace('  if (isClearlyHighImpact(assessment)) executionRecommendation = "freshApproval";\n',
                              '  if (assessment.executionRecommendation === "automatic" && (assessment.effectSeverity === "broad" || assessment.effectSeverity === "systemic" || assessment.reversibility === "irreversible" || assessment.secretHandling === "thirdPartyExposure" || assessment.secretHandling === "plaintextSecretExposure")) executionRecommendation = "freshApproval";\n')
          write(p, text)

          # 8) Lifecycle schema includes preflight via base protocol automatically; update tests will validate.

          # 9) Agent-initiated MCP Secret operations must supply semantics. No compatibility fallback.
          p = 'mcp-server/src/server.ts'
          text = read(p)
          text = text.replace('const optionalAgentRiskAssessment = AgentRiskProposal.optional();', 'const requiredAgentRiskAssessment = AgentRiskProposal;')
          text = text.replace('agentAssessment: optionalAgentRiskAssessment', 'agentAssessment: requiredAgentRiskAssessment')
          write(p, text)

          # 10) Docs describe actual two-phase architecture.
          p = 'docs/security/context-bounded-risk-judge.md'
          text = read(p)
          text = text.replace('2. Ordinary, high-confidence, user-aligned operations use the main-Agent fast path. There is no second model call.\n3. SVLT calls its separately configured semantic judge only for a gray zone: uncertainty, unclear/unrelated task alignment, low confidence, unresolved semantic dimensions, dynamic/opaque execution, or an internally contradictory automatic recommendation.\n4. The daemon consumes the structured assessment directly.',
'''2. The MCP boundary first asks the daemon for a deterministic preflight. The daemon returns `FAST`, `HARD`, `GRAY`, or `DENIED` plus the local rule, approval floor, blast-radius signal, and sanitized reasons. TypeScript does not duplicate the Swift classifier registry.
3. `FAST` executes with the main Agent assessment and no second model call. `HARD` goes directly to fresh owner approval. `DENIED` stays denied. Only `GRAY` invokes SVLT's separately configured semantic judge.
4. Gray routing includes unresolved Agent semantics, dynamic/opaque execution, new credential scope, and conflicts between an `automatic` recommendation and a deterministic soft-risk family such as deletion or destructive data mutation.
5. The daemon consumes the structured assessment directly and rechecks the deterministic floor. A main-Agent `automatic` assessment cannot directly lower a daemon `GRAY` signal; an independent judgment is required.
6. String marker protocols such as `SVLT_JUDGE_V1`, `SVLT_JUDGE_V2`, and `SVLT_AGENT_V2` are retired rather than supported as a compatibility layer.''')
          text = text.replace('4. The daemon consumes the structured assessment directly. String marker protocols such as `SVLT_JUDGE_V1`, `SVLT_JUDGE_V2`, and `SVLT_AGENT_V2` are retired rather than supported as a compatibility layer.\n5. Malformed or identity-invalid operations are still denied. Fixed hard-floor rules still require fresh approval regardless of semantic recommendation.\n', '')
          write(p, text)

          # 11) Targeted tests: daemon preflight routing, hard floors, classifier regressions.
          p = 'Tests/VaultAuthorizationTests/SecretOperationPolicyEngineTests.swift'
          text = read(p)
          anchor = '\nprivate func engine() -> SecretOperationPolicyEngine {'
          tests = r'''

@Test func preflightRoutesOrdinaryHardAndGrayOperationsBeforeJudge() throws {
    let reference = try testReference()
    let metadata = [policyMetadata(reference, destinations: ["nas.local"], protocols: ["ssh"])]
    let policy = engine()

    let fast = policy.semanticPreflight(
        SecretOperationDescriptor(
            actionType: .sshCommand,
            secretReferences: [reference],
            destination: "nas.local",
            port: 22,
            protocolType: .ssh,
            command: "systemctl status jellyfin",
            agentAssessment: semanticAssessment(
                recommendation: .automatic,
                severity: .none,
                reversibility: .readOnly,
                reason: "Read requested service status"
            )
        ),
        metadata: metadata
    )
    #expect(fast.route == .fast)

    let gray = policy.semanticPreflight(
        SecretOperationDescriptor(
            actionType: .sshCommand,
            secretReferences: [reference],
            destination: "nas.local",
            port: 22,
            protocolType: .ssh,
            command: "rm -rf /share/photos",
            agentAssessment: semanticAssessment(
                recommendation: .automatic,
                severity: .bounded,
                reversibility: .recoverable,
                reason: "Deliberately optimistic main-Agent assessment"
            )
        ),
        metadata: metadata
    )
    #expect(gray.route == .gray)
    #expect(gray.blastRadius == .unknown)

    let hard = policy.semanticPreflight(
        SecretOperationDescriptor(
            actionType: .sshCommand,
            secretReferences: [reference],
            destination: "nas.local",
            port: 22,
            protocolType: .ssh,
            command: "zpool destroy tank",
            agentAssessment: semanticAssessment(
                recommendation: .automatic,
                severity: .minor,
                reversibility: .easy,
                reason: "Deliberately optimistic main-Agent assessment"
            )
        ),
        metadata: metadata
    )
    #expect(hard.route == .hard)
    #expect(hard.blastRadius == .systemic)
}

@Test func mainAgentCannotDirectlyDowngradeGrayDeletionButIndependentJudgeCan() throws {
    let reference = try testReference()
    let metadata = [policyMetadata(reference, destinations: ["nas.local"], protocols: ["ssh"])]
    func descriptor(source: AgentRiskAssessment.Source) -> SecretOperationDescriptor {
        SecretOperationDescriptor(
            actionType: .sshCommand,
