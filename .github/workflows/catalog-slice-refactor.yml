name: Catalog slice access repair

on:
  push:
    branches: [codex/catalog-agent-operations-slice]

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/catalog-agent-operations-slice
          fetch-depth: 0
      - name: Align cross-file access boundary
        run: |
          python3 <<'PY'
          from pathlib import Path

          primary = Path('Sources/VaultService/VaultAppServices.swift')
          source = primary.read_text()
          required = {
              'private enum CatalogMutationPhase: String {': 'enum CatalogMutationPhase: String {',
              'private enum SecretOperationAuthorizationPath: Sendable {': 'enum SecretOperationAuthorizationPath: Sendable {',
          }
          for old, new in required.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one {old!r}, found {count}')
              source = source.replace(old, new, 1)
          primary.write_text(source)

          old = 'private func assessCatalogReadAuthorization('
          new = 'func assessCatalogReadAuthorization('
          files = sorted(Path('Sources/VaultService').glob('*.swift'))
          old_hits = [(path, path.read_text().count(old)) for path in files]
          old_hits = [(path, count) for path, count in old_hits if count]
          new_count = sum(path.read_text().count(new) for path in files)
          if sum(count for _, count in old_hits) == 1:
              path = old_hits[0][0]
              text = path.read_text()
              path.write_text(text.replace(old, new, 1))
          elif sum(count for _, count in old_hits) == 0 and new_count == 1:
              pass
          else:
              raise SystemExit(
                  f'assessCatalogReadAuthorization declaration is ambiguous: old={old_hits}, new_count={new_count}'
              )
          PY
          git diff --check
      - name: Verify XcodeGen parity
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          ./scripts/check-xcodegen-parity.sh
      - name: Compile Swift targets
        run: |
          xcodebuild build \
            -project SVLT.xcodeproj \
            -scheme AgentSecretVault \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/svlt-derived" \
            CODE_SIGNING_ALLOWED=NO
      - name: Commit verified access repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Sources/VaultService/*.swift
          git commit -m 'refactor: align catalog slice access boundary'
          git push origin HEAD:codex/catalog-agent-operations-slice
