name: Catalog slice verification

on:
  push:
    branches: [codex/catalog-agent-operations-slice]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/catalog-agent-operations-slice
          fetch-depth: 0
      - name: Verify XcodeGen parity
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          ./scripts/check-xcodegen-parity.sh
      - name: Compile Swift targets
        run: |
          xcodebuild build \
            -project SVLT.xcodeproj \
            -scheme AgentSecretVault \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/svlt-derived" \
            CODE_SIGNING_ALLOWED=NO
      - name: Check architecture budgets and whitespace
        run: |
          ./scripts/check-architecture-budgets.sh
          git diff --check 57b983c2e23516d6f40ce747817c7353bf6f8e43...HEAD
