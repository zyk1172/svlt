name: Catalog slice access repair

on:
  push:
    branches: [codex/catalog-agent-operations-slice]

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/catalog-agent-operations-slice
          fetch-depth: 0
      - name: Align cross-file access boundary
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('Sources/VaultService/VaultAppServices.swift')
          source = path.read_text()
          required = {
              'private enum CatalogMutationPhase: String {': 'enum CatalogMutationPhase: String {',
              'private enum SecretOperationAuthorizationPath: Sendable {': 'enum SecretOperationAuthorizationPath: Sendable {',
          }
          for old, new in required.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one {old!r}, found {count}')
              source = source.replace(old, new, 1)

          # The initial extraction already promotes private helpers referenced
          # by the extracted slice. Keep this repair safe if that promotion
          # has already happened on the branch.
          old = 'private func assessCatalogReadAuthorization('
          new = 'func assessCatalogReadAuthorization('
          if source.count(old) == 1:
              source = source.replace(old, new, 1)
          elif source.count(new) != 1:
              raise SystemExit('assessCatalogReadAuthorization declaration not found exactly once')

          path.write_text(source)
          PY
          git diff --check
      - name: Verify XcodeGen parity
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          ./scripts/check-xcodegen-parity.sh
      - name: Compile Swift targets
        run: |
          xcodebuild build \
            -project SVLT.xcodeproj \
            -scheme AgentSecretVault \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/svlt-derived" \
            CODE_SIGNING_ALLOWED=NO
      - name: Commit verified access repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Sources/VaultService/VaultAppServices.swift
          git commit -m 'refactor: align catalog slice access boundary'
          git push origin HEAD:codex/catalog-agent-operations-slice
