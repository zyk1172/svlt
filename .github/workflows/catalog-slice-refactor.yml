name: Catalog slice access repair

on:
  push:
    branches: [codex/catalog-agent-operations-slice]

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/catalog-agent-operations-slice
          fetch-depth: 0
      - name: Align required cross-file access boundary
        run: |
          python3 <<'PY'
          from pathlib import Path

          app_path = Path('Sources/VaultService/VaultAppServices.swift')
          app_source = app_path.read_text()
          app_replacements = {
              'private enum CatalogMutationPhase: String {': 'enum CatalogMutationPhase: String {',
              'private enum SecretOperationAuthorizationPath: Sendable {': 'enum SecretOperationAuthorizationPath: Sendable {',
          }
          for old, new in app_replacements.items():
              count = app_source.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one {old!r}, found {count}')
              app_source = app_source.replace(old, new, 1)
          app_path.write_text(app_source)

          catalog_path = Path('Sources/VaultService/VaultAppServices+CatalogOperations.swift')
          catalog_source = catalog_path.read_text()
          old = '    private func finishSecureInputRequest(\n'
          new = '    func finishSecureInputRequest(\n'
          count = catalog_source.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one finishSecureInputRequest declaration, found {count}')
          catalog_path.write_text(catalog_source.replace(old, new, 1))
          PY
          git diff --check
      - name: Verify XcodeGen parity
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          ./scripts/check-xcodegen-parity.sh
      - name: Compile Swift targets
        run: |
          xcodebuild build \
            -project SVLT.xcodeproj \
            -scheme AgentSecretVault \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/svlt-derived" \
            CODE_SIGNING_ALLOWED=NO
      - name: Commit verified access repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Sources/VaultService/VaultAppServices.swift Sources/VaultService/VaultAppServices+CatalogOperations.swift
          git commit -m 'refactor: align catalog slice access boundary'
          git push origin HEAD:codex/catalog-agent-operations-slice
