name: Reconcile main into catalog owner

on:
  push:
    branches:
      - codex/daemon-owned-catalog-state
    paths:
      - '.github/workflows/reconcile-main-into-catalog-owner.yml'
      - 'scripts/reconcile-main-into-catalog-owner.trigger*'

permissions:
  contents: write

jobs:
  reconcile-and-validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main and resolve debt ceiling
        run: |
          set -euo pipefail
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U)"
          if [[ "$merge_status" -ne 0 && "$conflicts" != "scripts/check-architecture-budgets.sh" ]]; then
            echo "Unexpected merge conflicts:"
            printf '%s\n' "$conflicts"
            exit 1
          fi

          if [[ -n "$conflicts" ]]; then
            git checkout --ours scripts/check-architecture-budgets.sh
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          service = Path('Sources/VaultService/VaultAppServices.swift')
          budget = Path('scripts/check-architecture-budgets.sh')
          size = service.stat().st_size
          prior_catalog_owner_ceiling = 253_937
          if size > prior_catalog_owner_ceiling:
              raise SystemExit(
                  f'Combined VaultAppServices.swift is {size} bytes, above the existing '
                  f'catalog-owner debt ceiling {prior_catalog_owner_ceiling}; extract code instead of raising budget.'
              )
          text = budget.read_text()
          pattern = r'"Sources/VaultService/VaultAppServices\.swift:\d+"'
          updated, count = re.subn(
              pattern,
              f'"Sources/VaultService/VaultAppServices.swift:{size}"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('VaultAppServices architecture budget entry not found exactly once')
          budget.write_text(updated)
          print(f'Combined VaultAppServices ceiling -> {size} bytes')
          PY
          git add scripts/check-architecture-budgets.sh

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Regenerate project
        run: xcodegen generate
      - name: Validate combined architecture
        run: |
          bash scripts/check-architecture-budgets.sh
          bash scripts/check-catalog-owner-boundary.sh
          git diff --check
      - name: Run macOS tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project SVLT.xcodeproj \
            -scheme AgentSecretVault \
            -destination 'platform=macOS' \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Commit merged main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'merge: reconcile catalog ownership with operation lifecycle'
          git push
