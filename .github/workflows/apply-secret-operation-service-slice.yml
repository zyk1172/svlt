name: Apply Secret Operation Service Slice

on:
  push:
    branches: [codex/secret-operation-service-slice]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'refactor: apply secret operation service slice'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/secret-operation-service-slice
          fetch-depth: 0
      - name: Apply asserted source transform
        run: python3 scripts/apply-secret-operation-service-slice.py
      - name: Verify transform diff
        run: |
          git diff --check
          git diff -- Sources/VaultService/VaultAppServices.swift Sources/VaultService/SecretOperationService.swift scripts/check-architecture-budgets.sh
      - name: Commit transformed source and remove one-shot machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-secret-operation-service-slice.py .github/workflows/apply-secret-operation-service-slice.yml
          git add Sources/VaultService/VaultAppServices.swift Sources/VaultService/SecretOperationService.swift scripts/check-architecture-budgets.sh
          git commit -m "refactor: apply secret operation service slice"
          git push origin HEAD:codex/secret-operation-service-slice
