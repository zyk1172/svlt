name: Audit execution timeout references

on:
  push:
    branches:
      - codex/approval-2m-unbounded-execution

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find execution timeout and process runner references
        run: |
          echo '=== timeout-related references ==='
          grep -RInE --exclude-dir=SVLT.xcodeproj 'timeoutMs|batchTotalTimeout|defaultTimeout|operationApprovalTimeout' Sources Tests mcp-server docs plugins || true
          echo '=== ProcessRunning conformers/calls ==='
          grep -RInE --exclude-dir=SVLT.xcodeproj 'ProcessRunning|processRunner\.run\(' Sources Tests || true
          echo '=== session expiry ==='
          grep -RInE --exclude-dir=SVLT.xcodeproj 'idleTTL|absoluteTTL|reapExpired|isExpired' Sources/VaultExecution Tests/VaultExecutionTests || true
