name: PR79 Review Fix V3

on:
  push:
    branches:
      - codex/daemon-owned-catalog-state

permissions:
  contents: write

jobs:
  apply-review-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/daemon-owned-catalog-state
      - name: Apply patch
        run: python3 .github/pr79_review_fix.py
      - name: Restore unrelated lockfile drift
        run: git show 82f0b3c29f4a2df50784f2c9d1b17c68488e9a63:mcp-server/package-lock.json > mcp-server/package-lock.json
      - name: Validate staged changes
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/check-catalog-owner-boundary.sh
          chmod +x scripts/check-catalog-owner-boundary.sh
          git diff --check
      - name: Commit fixes and remove temporary runner
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr79-review-fix.yml .github/workflows/pr79-review-fix-v2.yml .github/workflows/pr79-review-fix-v3.yml .github/pr79_review_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: close PR79 catalog ownership review blockers"
          git push origin HEAD:codex/daemon-owned-catalog-state
