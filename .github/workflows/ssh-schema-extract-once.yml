name: Extract SSH schema from MCP monolith once

on:
  push:
    branches:
      - codex/fix-ssh-timeout-compat

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-ssh-timeout-compat
          fetch-depth: 0
      - name: Extract SSH schemas and lower architecture ceiling
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          server_path = Path("mcp-server/src/server.ts")
          server = server_path.read_text()

          import_anchor = 'import { AgentRiskProposal, agentAssessment } from "./agent-assessment.js";\n'
          import_line = 'import { SshCommandBatchInput, SshCommandInput } from "./ssh-input.js";\n'
          if server.count(import_anchor) != 1:
              raise SystemExit(f"expected one agent-assessment import anchor, found {server.count(import_anchor)}")
          if import_line in server:
              raise SystemExit("SSH input import already present")
          server = server.replace(import_anchor, import_anchor + import_line, 1)

          start_marker = "const SshCommandInput = z\n"
          next_marker = "const ApiRequestInput = z\n"
          if server.count(start_marker) != 1:
              raise SystemExit(f"expected one local SSH schema block start, found {server.count(start_marker)}")
          start = server.index(start_marker)
          end = server.index(next_marker, start)
          removed = server[start:end]
          if "const SshCommandBatchInput = z" not in removed:
              raise SystemExit("SSH batch schema was not inside extraction range")
          if "Deprecated compatibility field; ignored. SSH execution has no fixed deadline." not in removed:
              raise SystemExit("expected patched SSH timeout semantics before extraction")
          server = server[:start] + server[end:]
          server_path.write_text(server)

          budget_path = Path("scripts/check-architecture-budgets.sh")
          budget = budget_path.read_text()
          old_budget = '  "mcp-server/src/server.ts:128848"\n'
          if budget.count(old_budget) != 1:
              raise SystemExit(f"expected one old server.ts budget, found {budget.count(old_budget)}")
          new_size = len(server.encode("utf-8"))
          budget = budget.replace(old_budget, f'  "mcp-server/src/server.ts:{new_size}"\n', 1)
          budget_path.write_text(budget)
          print(f"server.ts extracted size: {new_size} bytes")
          PY

          git diff --check
          bash scripts/check-architecture-budgets.sh
          git diff -- mcp-server/src/server.ts scripts/check-architecture-budgets.sh
      - name: Commit extraction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mcp-server/src/server.ts scripts/check-architecture-budgets.sh
          git commit -m 'refactor: move SSH input schemas out of server'
          git push origin HEAD:codex/fix-ssh-timeout-compat
