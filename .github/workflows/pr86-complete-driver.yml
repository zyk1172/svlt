name: PR86 complete driver
on:
  push:
    branches: [codex/intent-first-authorization]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/intent-first-authorization
          fetch-depth: 0
      - name: Apply remaining review fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/pr86-complete.py')
          s = p.read_text()
          old = '''response_marker = '  z.object({ type: z.literal("secretOperation"), output: SecretOperationOutput }).strict(),'
if response_marker not in text:
    raise SystemExit("protocol secretOperation response marker missing")
text = text.replace(response_marker, response_marker + '\\n  z.object({ type: z.literal("secretOperationPreflight"), result: SecretOperationPreflight }).strict(),', 1)'''
          new = '''response_marker = \'''  z
    .object({
      type: z.literal("secretOperation"),
      output: SecretOperationOutput
    })
    .strict(),\'''
if response_marker not in text:
    raise SystemExit("protocol secretOperation response marker missing")
text = text.replace(response_marker, response_marker + '\\n  z.object({ type: z.literal("secretOperationPreflight"), result: SecretOperationPreflight }).strict(),', 1)'''
          if old not in s:
              raise SystemExit('runtime repair marker missing')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 scripts/pr86-complete.py
      - name: Repository checks
        run: |
          git diff --check
          bash scripts/check-architecture-budgets.sh
          bash scripts/check-runtime-mutation-boundary.sh
          bash scripts/check-catalog-owner-boundary.sh
      - name: MCP verification
        working-directory: mcp-server
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Commit verified changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/pr86-complete.py .github/workflows/pr86-complete-driver.yml
          git add Sources Tests mcp-server docs ProtocolFixtures || true
          git diff --cached --check
          git commit -m 'fix: finish daemon-owned semantic preflight'
          git push origin HEAD:codex/intent-first-authorization
