name: PR86 complete driver
on:
  push:
    branches: [codex/intent-first-authorization]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/intent-first-authorization
          fetch-depth: 0
      - name: Apply remaining review fixes and migrate tests
        run: |
          python3 scripts/pr86-repair-marker.py
          python3 scripts/pr86-complete.py
          python3 scripts/pr86-migrate-tests.py
          python3 scripts/pr86-migrate-tests-followup.py
      - name: Repository checks
        run: |
          git diff --check
          bash scripts/check-architecture-budgets.sh
          bash scripts/check-runtime-mutation-boundary.sh
          bash scripts/check-catalog-owner-boundary.sh
      - name: MCP verification
        working-directory: mcp-server
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Commit verified changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f scripts/pr86-complete.py scripts/pr86-repair-marker.py scripts/pr86-migrate-tests.py scripts/pr86-migrate-tests-followup.py .github/workflows/pr86-complete-driver.yml
          git add Sources Tests mcp-server docs ProtocolFixtures || true
          git diff --cached --check
          git commit -m 'fix: finish daemon-owned semantic preflight'
          git push origin HEAD:codex/intent-first-authorization
