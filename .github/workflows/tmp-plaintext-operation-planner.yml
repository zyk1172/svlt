name: Temporary plaintext operation planner extraction

on:
  push:
    branches:
      - codex/extract-plaintext-operation-planner

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Extract plaintext operation planning
        run: |
          cat > Sources/VaultService/CatalogPlaintextOperationPlanner.swift <<'SWIFT'
          import Foundation
          import VaultCore
          import VaultIPC

          /// Owns the pure, non-secret planning rules shared by reveal, copy,
          /// and export operations. It validates opaque secret references and
          /// placeholder structure, but never resolves metadata, plaintext, or keys.
          struct CatalogPlaintextOperationPlanner: Sendable {
              func descriptor(
                  action: SecretOperationAction,
                  references: [String],
                  context: RevealContext,
                  effects: [String]
              ) throws -> SecretOperationDescriptor {
                  let parsedReferences = try validatedReferences(references, context: context)
                      .map(SecretReference.init)
                  return SecretOperationDescriptor(
                      actionType: action,
                      secretReferences: parsedReferences,
                      destination: context.destination,
                      requestedEffects: effects,
                      agentAssessment: context.agentAssessment
                  )
              }

              func validatedReferences(
                  _ references: [String],
                  context: RevealContext
              ) throws -> [String] {
                  guard !references.isEmpty else {
                      throw VaultAppServicesRevealError.invalidRevealContext
                  }

                  let validated: [String]
                  do {
                      validated = try references.map { try SecretReference($0).description }
                  } catch {
                      throw VaultAppServicesRevealError.invalidReference
                  }
                  guard Set(validated).count == validated.count else {
                      throw VaultAppServicesRevealError.invalidReference
                  }
                  try validate(context, referenceCount: validated.count)
                  return validated
              }

              func resolveTemplate(
                  _ template: String,
                  ranges: [ReferenceRange],
                  plaintexts: [String]
              ) throws -> String {
                  var replacements: [String: String] = [:]
                  for range in ranges {
                      guard plaintexts.indices.contains(range.index), !range.placeholder.isEmpty else {
                          throw VaultAppServicesRevealError.invalidRevealContext
                      }
                      guard replacements[range.placeholder] == nil else {
                          throw VaultAppServicesRevealError.invalidRevealContext
                      }
                      replacements[range.placeholder] = plaintexts[range.index]
                  }
                  return replacePlaceholders(in: template, replacements: replacements)
              }

              private func validate(_ context: RevealContext, referenceCount: Int) throws {
                  guard context.ranges.count == referenceCount else {
                      throw VaultAppServicesRevealError.invalidRevealContext
                  }

                  var seenIndices: Set<Int> = []
                  var seenPlaceholders: Set<String> = []
                  for range in context.ranges {
                      guard 0..<referenceCount ~= range.index,
                            !range.placeholder.isEmpty,
                            seenIndices.insert(range.index).inserted,
                            seenPlaceholders.insert(range.placeholder).inserted
                      else {
                          throw VaultAppServicesRevealError.invalidRevealContext
                      }
                      guard countOccurrences(of: range.placeholder, in: context.template) == 1 else {
                          throw VaultAppServicesRevealError.invalidRevealContext
                      }
                  }

                  let placeholders = Array(seenPlaceholders)
                  for lhsIndex in placeholders.indices {
                      for rhsIndex in placeholders.indices where lhsIndex != rhsIndex {
                          guard !placeholders[lhsIndex].contains(placeholders[rhsIndex]) else {
                              throw VaultAppServicesRevealError.invalidRevealContext
                          }
                      }
                  }
              }

              private func countOccurrences(of needle: String, in haystack: String) -> Int {
                  var count = 0
                  var searchRange = haystack.startIndex..<haystack.endIndex
                  while let range = haystack.range(of: needle, range: searchRange) {
                      count += 1
                      searchRange = range.upperBound..<haystack.endIndex
                  }
                  return count
              }

              private func replacePlaceholders(
                  in template: String,
                  replacements: [String: String]
              ) -> String {
                  var result = ""
                  var remaining = template[...]
                  let placeholders = replacements.keys.sorted { lhs, rhs in
                      if lhs.count == rhs.count { return lhs < rhs }
                      return lhs.count > rhs.count
                  }

                  while !remaining.isEmpty {
                      let nextMatch = placeholders.compactMap { placeholder -> (String, Range<String.Index>)? in
                          guard let range = remaining.range(of: placeholder) else { return nil }
                          return (placeholder, range)
                      }
                      .min { lhs, rhs in
                          if lhs.1.lowerBound == rhs.1.lowerBound {
                              return lhs.0.count > rhs.0.count
                          }
                          return lhs.1.lowerBound < rhs.1.lowerBound
                      }

                      guard let nextMatch else {
                          result.append(contentsOf: remaining)
                          break
                      }
                      result.append(contentsOf: remaining[..<nextMatch.1.lowerBound])
                      result.append(replacements[nextMatch.0] ?? "")
                      remaining = remaining[nextMatch.1.upperBound...]
                  }
                  return result
              }
          }
          SWIFT

          cat > Tests/VaultAuthorizationTests/CatalogPlaintextOperationPlannerTests.swift <<'SWIFT'
          import Testing
          import VaultCore
          import VaultIPC
          @testable import VaultService

          private let plannerReferenceA = "secret://0123456789ABCDEFGHJKMNPQRS"
          private let plannerReferenceB = "secret://0123456789ABCDEFGHJKMNPQRT"

          @Test func plaintextPlannerBuildsBoundDescriptor() throws {
              let planner = CatalogPlaintextOperationPlanner()
              let context = RevealContext(
                  reason: "export",
                  template: "user={{0}} password={{1}}",
                  ranges: [
                      ReferenceRange(index: 0, placeholder: "{{0}}"),
                      ReferenceRange(index: 1, placeholder: "{{1}}")
                  ],
                  destination: "/tmp/output.txt"
              )

              let descriptor = try planner.descriptor(
                  action: .exportPlaintext,
                  references: [plannerReferenceA, plannerReferenceB],
                  context: context,
                  effects: ["write-local-file"]
              )

              #expect(descriptor.actionType == .exportPlaintext)
              #expect(descriptor.secretReferences.map(\.description) == [plannerReferenceA, plannerReferenceB])
              #expect(descriptor.destination == "/tmp/output.txt")
              #expect(descriptor.requestedEffects == ["write-local-file"])
              #expect(descriptor.agentAssessment == context.agentAssessment)
          }

          @Test func plaintextPlannerRejectsDuplicateReferencesAndMalformedRanges() throws {
              let planner = CatalogPlaintextOperationPlanner()
              let duplicateContext = RevealContext(
                  reason: "copy",
                  template: "{{0}} {{1}}",
                  ranges: [
                      ReferenceRange(index: 0, placeholder: "{{0}}"),
                      ReferenceRange(index: 1, placeholder: "{{1}}")
                  ]
              )
              #expect(throws: VaultAppServicesRevealError.invalidReference) {
                  try planner.validatedReferences(
                      [plannerReferenceA, plannerReferenceA],
                      context: duplicateContext
                  )
              }

              let repeatedPlaceholderContext = RevealContext(
                  reason: "copy",
                  template: "{{0}} and {{0}}",
                  ranges: [ReferenceRange(index: 0, placeholder: "{{0}}")]
              )
              #expect(throws: VaultAppServicesRevealError.invalidRevealContext) {
                  try planner.validatedReferences(
                      [plannerReferenceA],
                      context: repeatedPlaceholderContext
                  )
              }
          }

          @Test func plaintextPlannerRejectsOverlappingPlaceholderTokens() throws {
              let planner = CatalogPlaintextOperationPlanner()
              let context = RevealContext(
                  reason: "copy",
                  template: "A={{0}} B={{0}}x",
                  ranges: [
                      ReferenceRange(index: 0, placeholder: "{{0}}"),
                      ReferenceRange(index: 1, placeholder: "{{0}}x")
                  ]
              )
              #expect(throws: VaultAppServicesRevealError.invalidRevealContext) {
                  try planner.validatedReferences(
                      [plannerReferenceA, plannerReferenceB],
                      context: context
                  )
              }
          }

          @Test func plaintextPlannerTemplateReplacementDoesNotReinterpretSecretText() throws {
              let planner = CatalogPlaintextOperationPlanner()
              let text = try planner.resolveTemplate(
                  "A={{0}} B={{1}}",
                  ranges: [
                      ReferenceRange(index: 0, placeholder: "{{0}}"),
                      ReferenceRange(index: 1, placeholder: "{{1}}")
                  ],
                  plaintexts: ["literal {{1}}", "second-secret"]
              )
              #expect(text == "A=literal {{1}} B=second-secret")
          }
          SWIFT

          python3 <<'PY'
          from pathlib import Path

          path = Path('Sources/VaultService/VaultAppServices.swift')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              text = text.replace(old, new, 1)

          # Add a stateless pure planner beside the other focused collaborators.
          anchor = '    private let catalogSearchService = SecretCatalogEntrySearchService()\n'
          replace_once(
              anchor,
              anchor + '    private let plaintextOperationPlanner = CatalogPlaintextOperationPlanner()\n',
              'planner property'
          )

          old_plaintext = '''    private func plaintextOperation(
              action: SecretOperationAction,
              references: [String],
              context: RevealContext,
              effects: [String]
          ) async throws -> (SecretOperationDescriptor, [SecretPolicyMetadata]) {
              guard !references.isEmpty else {
                  throw VaultAppServicesRevealError.invalidRevealContext
              }

              let parsedReferences: [SecretReference]
              do {
                  parsedReferences = try references.map(SecretReference.init)
              } catch {
                  throw VaultAppServicesRevealError.invalidReference
              }
              guard Set(parsedReferences).count == parsedReferences.count else {
                  throw VaultAppServicesRevealError.invalidReference
              }
              try validateRevealContext(context, referenceCount: parsedReferences.count)
              let metadata = try await policyMetadata(for: parsedReferences)
              let descriptor = SecretOperationDescriptor(
                  actionType: action,
                  secretReferences: parsedReferences,
                  destination: context.destination,
                  requestedEffects: effects,
                  agentAssessment: context.agentAssessment
              )
              return (descriptor, metadata)
          }
'''
          new_plaintext = '''    private func plaintextOperation(
              action: SecretOperationAction,
              references: [String],
              context: RevealContext,
              effects: [String]
          ) async throws -> (SecretOperationDescriptor, [SecretPolicyMetadata]) {
              let descriptor = try plaintextOperationPlanner.descriptor(
                  action: action,
                  references: references,
                  context: context,
                  effects: effects
              )
              let metadata = try await policyMetadata(for: descriptor.secretReferences)
              return (descriptor, metadata)
          }
'''
          replace_once(old_plaintext, new_plaintext, 'plaintext operation planning')

          old_validation = '''        guard !references.isEmpty else {
              throw VaultAppServicesRevealError.invalidRevealContext
          }

          let validatedReferences: [String]
          do {
              validatedReferences = try references.map { try SecretReference($0).description }
          } catch {
              throw VaultAppServicesRevealError.invalidReference
          }
          guard Set(validatedReferences).count == validatedReferences.count else {
              throw VaultAppServicesRevealError.invalidReference
          }

          try validateRevealContext(context, referenceCount: validatedReferences.count)
'''
          new_validation = '''        let validatedReferences = try plaintextOperationPlanner.validatedReferences(
              references,
              context: context
          )
'''
          replace_once(old_validation, new_validation, 'resolve validation delegation')

          replace_once(
              '            text: try resolveTemplate(context.template, ranges: context.ranges, plaintexts: plaintexts),\n',
              '            text: try plaintextOperationPlanner.resolveTemplate(\n'
              '                context.template,\n'
              '                ranges: context.ranges,\n'
              '                plaintexts: plaintexts\n'
              '            ),\n',
              'template resolution delegation'
          )

          helper_start = text.index('    private func resolveTemplate(_ template: String, ranges: [ReferenceRange], plaintexts: [String]) throws -> String {')
          enum_start = text.index('\n}\n\npublic enum VaultAppServicesRevealError:', helper_start)
          # This helper group is at the end of the actor and contains only the
          # planner-owned template/context functions through replacePlaceholders.
          text = text[:helper_start] + text[enum_start:]

          for forbidden in [
              'private func validateRevealContext(',
              'private func countOccurrences(',
              'private func replacePlaceholders(',
              'private func resolveTemplate('
          ]:
              if forbidden in text:
                  raise SystemExit(f'planner helper remains in VaultAppServices: {forbidden}')

          path.write_text(text)

          budget = Path('scripts/check-architecture-budgets.sh')
          budget_text = budget.read_text()
          actual = len(text.encode())
          old_budget = 'Sources/VaultService/VaultAppServices.swift:255049'
          new_budget = f'Sources/VaultService/VaultAppServices.swift:{actual}'
          if budget_text.count(old_budget) != 1:
              raise SystemExit('expected current VaultAppServices budget exactly once')
          budget.write_text(budget_text.replace(old_budget, new_budget, 1))
          print(f'VaultAppServices.swift architecture ceiling -> {actual} bytes')
          PY

      - name: Regenerate Xcode project without target-order noise
        run: |
          cp SVLT.xcodeproj/project.pbxproj /tmp/svlt-before-plaintext-planner.pbxproj
          xcodegen generate --quiet --spec project.yml --project . --project-root . --cache-path /tmp/svlt-xcodegen-cache
          python3 <<'PY'
          from pathlib import Path
          import re
          before = Path('/tmp/svlt-before-plaintext-planner.pbxproj').read_text()
          generated_path = Path('SVLT.xcodeproj/project.pbxproj')
          generated = generated_path.read_text()
          pattern = re.compile(r'(\n\s*targets\s*=\s*\(\n)(.*?)(\n\s*\);)', re.S)
          old_match = pattern.search(before)
          new_match = pattern.search(generated)
          if old_match is None or new_match is None:
              raise SystemExit('unable to locate PBXProject targets block')
          generated = generated[:new_match.start(2)] + old_match.group(2) + generated[new_match.end(2):]
          generated_path.write_text(generated)
          PY

      - name: Verify extraction
        run: |
          bash scripts/check-xcodegen-parity.sh
          bash scripts/check-architecture-budgets.sh
          git diff --check
          xcodebuild test -project SVLT.xcodeproj -scheme VaultAuthorization -destination 'platform=macOS' -only-testing:VaultAuthorizationTests/CatalogPlaintextOperationPlannerTests

      - name: Commit extraction
        run: |
          git config user.name 'zyk1172'
          git config user.email '53221608+zyk1172@users.noreply.github.com'
          git add Sources/VaultService/CatalogPlaintextOperationPlanner.swift \
                  Sources/VaultService/VaultAppServices.swift \
                  Tests/VaultAuthorizationTests/CatalogPlaintextOperationPlannerTests.swift \
                  scripts/check-architecture-budgets.sh \
                  SVLT.xcodeproj/project.pbxproj
          if git diff --cached --quiet; then
            echo 'No extraction changes to commit.'
            exit 0
          fi
          git commit -m 'refactor: extract plaintext operation planner'
          git push
