name: Temporary secure-input lifecycle formatting

on:
  push:
    branches:
      - codex/extract-secure-input-lifecycle-owner

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/extract-secure-input-lifecycle-owner
          fetch-depth: 0
      - name: Normalize generated Swift indentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_path = Path("Sources/VaultService/VaultAppServices.swift")
          budget_path = Path("scripts/check-architecture-budgets.sh")
          app = app_path.read_text()

          insert_start = app.index("        let expiryTask = Task { [weak self] in\n")
          insert_end = app.index("        await emitAudit(\n", insert_start)
          new_insert = (
              "        let expiryTask = Task { [weak self] in\n"
              "            try? await Task.sleep(for: .seconds(180))\n"
              "            guard !Task.isCancelled else { return }\n"
              "            await self?.expireCatalogSecureInputRequest(id: request.id)\n"
              "        }\n"
              "        secureInputLifecycle.insert(\n"
              "            request,\n"
              "            auditContext: operationContext,\n"
              "            expiryTask: expiryTask\n"
              "        )\n"
          )
          app = app[:insert_start] + new_insert + app[insert_end:]

          finish_start = app.index("        guard let completion = secureInputLifecycle.finish(\n")
          finish_end = app.index("        secureInputNotifier.notifyQueueChanged(requestID: id)\n", finish_start)
          new_finish = (
              "        guard let completion = secureInputLifecycle.finish(\n"
              "            id: id,\n"
              "            status: status,\n"
              "            terminalDate: now()\n"
              "        ) else { return }\n"
              "        let request = completion.request\n"
              "        persistSecureInputReceipts()\n"
              "        let context = completion.auditContext\n"
          )
          app = app[:finish_start] + new_finish + app[finish_end:]

          assert new_insert in app
          assert new_finish in app
          app_path.write_text(app)

          budget = budget_path.read_text()
          new_size = len(app.encode())
          pattern = r'"Sources/VaultService/VaultAppServices\.swift:\d+"'
          replacement = f'"Sources/VaultService/VaultAppServices.swift:{new_size}"'
          budget, count = re.subn(pattern, replacement, budget, count=1)
          assert count == 1
          budget_path.write_text(budget)
          print(f"VaultAppServices.swift normalized at {new_size} bytes")
          PY
          git diff --check
          bash scripts/check-architecture-budgets.sh
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/VaultService/VaultAppServices.swift scripts/check-architecture-budgets.sh
          git diff --cached --exit-code && exit 1 || true
          git commit -m "style: normalize secure input lifecycle formatting"
          git push origin HEAD:codex/extract-secure-input-lifecycle-owner
