name: Temporary secure-input documentation fix

on:
  push:
    branches:
      - codex/extract-secure-input-receipt-store

permissions:
  contents: write

jobs:
  fix-doc-boundary:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/extract-secure-input-receipt-store
      - name: Move transaction documentation to its owner
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Sources/VaultService/CatalogSecureInputTransaction.swift")
          text = path.read_text()
          transaction_doc = """/// Owns the synchronous state transitions for one-shot Catalog Secure Input
          /// requests. The surrounding service owns authentication, encryption, I/O,
          /// notifications, and audit contexts; this value owns only request state and
          /// non-sensitive terminal receipts.
          """
          marker = "struct CatalogSecureInputTransaction: Sendable {"
          assert text.count(transaction_doc) == 1
          assert text.count(marker) == 1
          text = text.replace(transaction_doc, "", 1)
          text = text.replace(marker, transaction_doc + marker, 1)
          path.write_text(text)
          PY
          git diff --check
      - name: Commit documentation fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/VaultService/CatalogSecureInputTransaction.swift
          git diff --cached --exit-code && exit 1 || true
          git commit -m "docs: keep secure input ownership comments attached"
          git push origin HEAD:codex/extract-secure-input-receipt-store
