name: Apply policy fix runner

on:
  push:
    branches:
      - codex/intent-first-authorization

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Apply fix
        run: |
          python3 -c 'from pathlib import Path; import base64; p=Path("Sources/VaultAuthorization/SecretOperationPolicyEngine.swift"); s=p.read_text(); old=base64.b64decode("").decode(); new=base64.b64decode("").decode(); old2=base64.b64decode("ICAgICAgICAgICAgcG9saWN5UnVsZUlEOiBkZXNjcmlwdG9yLnNlY3JldFJlZmVyZW5jZXMuaXNFbXB0eQogICAgICAgICAgICAgICAgPyBsb2NhbC5wb2xpY3lSdWxlSUQKICAgICAgICAgICAgICAgIDogIlwobG9jYWwucG9saWN5UnVsZUlEKStpbnRlbnQtZmlyc3QiLAo=").decode(); new2=base64.b64decode("ICAgICAgICAgICAgcG9saWN5UnVsZUlEOiBzZW1hbnRpY1BhcnRpY2lwYXRlZAogICAgICAgICAgICAgICAgPyAiXChsb2NhbC5wb2xpY3lSdWxlSUQpK2ludGVudC1maXJzdCIKICAgICAgICAgICAgICAgIDogbG9jYWwucG9saWN5UnVsZUlELAo=").decode(); assert old in s; assert old2 in s; p.write_text(s.replace(old,new,1).replace(old2,new2,1))'
          rm -f swift-policy-diagnostic.txt .github/workflows/swift-policy-diagnostic.yml .github/workflows/apply-policy-fix.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: label only semantic authorization decisions'
          git push
