name: Apply Session-Scoped Approval Refactor

on:
  push:
    branches:
      - codex/remove-execution-approval-timeout

permissions:
  contents: write

jobs:
  refactor:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/remove-execution-approval-timeout
          fetch-depth: 0
      - name: Apply session-scoped reusable approval migration
        run: python3 .github/refactor_session_approval.py
      - name: Run Swift test suite
        run: |
          set -o pipefail
          xcodebuild test \
            -project SVLT.xcodeproj \
            -scheme AgentSecretVault \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/svlt-derived" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Commit refactor and remove temporary migration files
        run: |
          git rm .github/workflows/codex-remove-execution-approval-timeout.yml .github/refactor_session_approval.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources Tests docs/security
          git commit -m "fix: make reusable approvals session-scoped"
          git push origin HEAD:codex/remove-execution-approval-timeout
