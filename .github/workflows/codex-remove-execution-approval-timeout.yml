          forbidden = [
              "executionAuthorizationTTL",
              "executionTTL:",
              "executionAuthorizationExpiresAt",
              "executionAuthorizationWindowEnabled",
              "executionAuthorizationWindowDuration",
              "复用最多 300 秒",
              "固定 300 秒",
              "five-minute window",
          ]
          scan_roots = [Path("Sources"), Path("Tests"), Path("docs/security")]
          for needle in forbidden:
              hits = []
              for root in scan_roots:
                  for file in root.rglob("*"):
                      if not file.is_file():
                          continue
                      try:
                          value = file.read_text(encoding="utf-8")
                      except UnicodeDecodeError:
                          continue
                      if needle in value:
                          hits.append(str(file))
              if hits:
                  raise SystemExit(f"forbidden timed-approval token {needle!r} remains in: {hits}")
