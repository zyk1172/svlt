name: Apply Session-Scoped Approval Refactor

on:
  push:
    branches:
      - codex/remove-execution-approval-timeout

permissions:
  contents: write

jobs:
  refactor:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/remove-execution-approval-timeout
          fetch-depth: 0
      - name: Recover and run refactor script
        env:
          SCRIPT_SOURCE: https://raw.githubusercontent.com/zyk1172/svlt/8107a0b2a09cecfb8b0c56591fa4e58cbd09190d/.github/workflows/codex-remove-execution-approval-timeout.yml
        run: |
          curl -fsSL "$SCRIPT_SOURCE" -o "$RUNNER_TEMP/refactor-source.yml"
          python3 - "$RUNNER_TEMP/refactor-source.yml" "$RUNNER_TEMP/refactor.py" <<'PY'
          from pathlib import Path
          import sys
          source = Path(sys.argv[1]).read_text(encoding="utf-8")
          marker = "          from pathlib import Path\n"
          start = source.index(marker)
          end = source.index("\n          PY\n", start)
          body = source[start:end]
          body = "\n".join(line[10:] if line.startswith("          ") else line for line in body.splitlines()) + "\n"
          Path(sys.argv[2]).write_text(body, encoding="utf-8")
          PY
          python3 "$RUNNER_TEMP/refactor.py"
      - name: Run Swift test suite
        run: |
          xcodebuild test \
            -project SVLT.xcodeproj \
            -scheme AgentSecretVault \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/svlt-derived" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Commit refactor and remove temporary workflow
        run: |
          git rm .github/workflows/codex-remove-execution-approval-timeout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources Tests docs/security
          git commit -m "fix: make reusable approvals session-scoped"
          git push origin HEAD:codex/remove-execution-approval-timeout
