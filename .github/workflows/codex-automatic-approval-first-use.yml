name: Apply Automatic First-Use Authorization Refactor

on:
  push:
    branches:
      - codex/automatic-approval-first-use

permissions:
  contents: write

jobs:
  refactor:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/automatic-approval-first-use
          fetch-depth: 0

      - name: Apply intent-first first-use refactor
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {count}")
              return text.replace(old, new, 1)

          def replace_test(text, name, replacement):
              pattern = rf'@Test func {re.escape(name)}\(\) async throws \{{.*?\n\}}(?=\n\n@Test|\Z)'
              out, count = re.subn(pattern, replacement.rstrip(), text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"test {name}: expected 1 block, found {count}")
              return out

          # 1) Keep the legacy wire spelling, but it no longer implies a first-use prompt.
          path = "Sources/VaultCore/Models/SecretOperation.swift"
          text = read(path)
          text = replace_once(
              text,
              '''            case .automatic: return .none
            case .reusableApproval: return .reusableApproval
            case .freshApproval, .uncertain: return .freshApprovalRequired
''',
              '''            case .automatic, .reusableApproval:
                // `reusableApproval` remains decodable for older MCP clients,
                // but intent-first authorization no longer treats first use as
                // approval-worthy by itself. Ordinary work follows the same
                // automatic path and is promoted only by semantic/hard-floor
                // review.
                return .none
            case .freshApproval, .uncertain:
                return .freshApprovalRequired
''',
              "legacy reusable recommendation mapping"
          )
          write(path, text)

          # 2) Make automatic and legacy-reusable recommendations share all semantic safety checks.
          path = "Sources/VaultAuthorization/SecretOperationPolicyEngine.swift"
          text = read(path)
          text = replace_once(
              text,
              '''        let semanticConflict = semantic.executionRecommendation == .automatic
            && Self.automaticRecommendationNeedsReview(semantic)
''',
              '''        let semanticConflict = Self.isAutomaticApprovalRecommendation(semantic)
            && Self.automaticRecommendationNeedsReview(semantic)
''',
              "semantic conflict automatic compatibility"
          )
          text = replace_once(
              text,
              '''        let scopeConflict = semantic.executionRecommendation == .automatic
            && !binding.reasons.isEmpty
''',
              '''        let scopeConflict = Self.isAutomaticApprovalRecommendation(semantic)
            && !binding.reasons.isEmpty
''',
              "scope conflict automatic compatibility"
          )
          text = replace_once(
              text,
              '''    private static func normalizedSemanticRequirement(
        _ assessment: AgentRiskAssessment
    ) -> AuthorizationRequirement {
        if assessment.executionRecommendation == .automatic,
           automaticRecommendationNeedsReview(assessment) {
            return .freshApprovalRequired
        }
        return assessment.executionRecommendation.authorizationRequirement
    }

    private static func automaticRecommendationNeedsReview(_ assessment: AgentRiskAssessment) -> Bool {
''',
              '''    private static func normalizedSemanticRequirement(
        _ assessment: AgentRiskAssessment
    ) -> AuthorizationRequirement {
        if isAutomaticApprovalRecommendation(assessment),
           automaticRecommendationNeedsReview(assessment) {
            return .freshApprovalRequired
        }
        return assessment.executionRecommendation.authorizationRequirement
    }

    private static func isAutomaticApprovalRecommendation(_ assessment: AgentRiskAssessment) -> Bool {
        switch assessment.executionRecommendation {
        case .automatic, .reusableApproval:
            return true
        case .freshApproval, .uncertain:
            return false
        }
    }

    private static func automaticRecommendationNeedsReview(_ assessment: AgentRiskAssessment) -> Bool {
''',
              "semantic normalization helper"
          )
          text = text.replace(
              '"HTTP 请求属于普通操作，首次需要本机审批，之后可在执行窗口内复用"',
              '"HTTP 请求属于普通操作；是否需要用户审批由结构化语义判断决定"'
          )
          text = text.replace(
              '"SFTP/SCP 操作属于普通操作，首次需要本机审批，之后可在执行窗口内复用"',
              '"SFTP/SCP 操作属于普通操作；是否需要用户审批由结构化语义判断决定"'
          )
          write(path, text)

          # 3) The deterministic SSH classifier remains a soft signal, not a mandatory first-use gate.
          path = "Sources/VaultAuthorization/SSHCommandRiskClassifier.swift"
          text = read(path)
          text = text.replace(
              '''/// SVLT uses a device-owner authorization lease, not a semantic command
/// firewall.
///
/// The classifier answers exactly one question: "which authorization level
/// does this command need?" It never answers "is this command allowed?".
///
/// - Every technically valid SSH command defaults to `reusableApproval`:
///   one device-owner approval opens the scoped five-minute window.
''',
              '''/// SVLT uses intent-first semantic authorization, not a semantic command
/// firewall.
///
/// This classifier supplies a deterministic risk signal. Its ordinary
/// `reusableApproval` result is a legacy/local classification label and does
/// not itself force a first-use prompt; the structured semantic assessment
/// decides whether the concrete operation is automatic or needs approval.
///
/// - Every technically valid SSH command defaults to the ordinary
///   `reusableApproval` classification signal.
'''
          )
          text = text.replace(
              '"SSH 批处理属于普通操作，首次需要本机审批，之后可在执行窗口内复用"',
              '"SSH 批处理属于普通操作；是否需要用户审批由结构化语义判断决定"'
          )
          text = text.replace(
              '"SSH 命令属于普通操作，首次需要本机审批，之后可在执行窗口内复用"',
              '"SSH 命令属于普通操作；是否需要用户审批由结构化语义判断决定"'
          )
          write(path, text)

          # 4) MCP compatibility: old `reusableApproval` proposals are normalized to automatic.
          path = "mcp-server/src/agent-assessment.ts"
          text = read(path)
          text = replace_once(
              text,
              '''  .describe(
    "Main Agent semantic assessment. Sensitive/privileged is distinct from dangerous: ordinary user-aligned work should recommend automatic; use freshApproval only for genuine destructive/high-impact effects or unnecessary Secret plaintext exposure; use uncertain only when effect or task alignment cannot be resolved."
  );
''',
              '''  .describe(
    "Main Agent semantic assessment. Sensitive/privileged is distinct from dangerous: ordinary user-aligned work should recommend automatic and does not require a first-use approval; use freshApproval only for genuine destructive/high-impact effects or unnecessary Secret plaintext exposure; use uncertain only when effect or task alignment cannot be resolved. reusableApproval is accepted only as a legacy compatibility spelling and is normalized to automatic."
  );
''',
              "assessment guidance"
          )
          text = replace_once(
              text,
              '''  return {
    source: "mainAgent",
    declaredRisk: proposal.executionRecommendation === "automatic" ? "silent" : "approvalRequired",
    ...proposal
  };
''',
              '''  const executionRecommendation = proposal.executionRecommendation === "reusableApproval"
    ? "automatic"
    : proposal.executionRecommendation;
  return {
    source: "mainAgent",
    declaredRisk: executionRecommendation === "automatic" ? "silent" : "approvalRequired",
    ...proposal,
    executionRecommendation
  };
''',
              "main agent reusable normalization"
          )
          write(path, text)

          path = "mcp-server/src/risk-judge.ts"
          text = read(path)
          text = replace_once(
              text,
              '''function normalizeAssessment(assessment: AgentRiskAssessment): AgentRiskAssessment {
  let executionRecommendation = assessment.executionRecommendation;
  if (assessment.executionRecommendation === "automatic" && (assessment.effectSeverity === "broad" || assessment.effectSeverity === "systemic" || assessment.reversibility === "irreversible" || assessment.secretHandling === "thirdPartyExposure" || assessment.secretHandling === "plaintextSecretExposure")) executionRecommendation = "freshApproval";
''',
              '''function normalizeAssessment(assessment: AgentRiskAssessment): AgentRiskAssessment {
  let executionRecommendation = assessment.executionRecommendation === "reusableApproval"
    ? "automatic"
    : assessment.executionRecommendation;
  if (executionRecommendation === "automatic" && (assessment.effectSeverity === "broad" || assessment.effectSeverity === "systemic" || assessment.reversibility === "irreversible" || assessment.secretHandling === "thirdPartyExposure" || assessment.secretHandling === "plaintextSecretExposure")) executionRecommendation = "freshApproval";
''',
              "judge reusable normalization"
          )
          write(path, text)

          # 5) Policy tests: legacy reusable is compatibility input for automatic, not a first-use approval level.
          path = "Tests/VaultAuthorizationTests/SecretOperationPolicyEngineTests.swift"
          text = read(path)
          text = replace_once(
              text,
              '#expect(decision(.reusableApproval).authorizationRequirement == .reusableApproval)',
              '#expect(decision(.reusableApproval).authorizationRequirement == .none)',
              "policy reusable expectation"
          )
          text = replace_once(
              text,
              '#expect(decision.authorizationRequirement == .reusableApproval, "statement: \\(statement)")',
              '#expect(decision.authorizationRequirement == .none, "statement: \\(statement)")',
              "verified judge reusable expectation"
          )
          write(path, text)

          # 6) Service fixtures: an explicit approvalRequired/denied hint now means
          # an actual fresh recommendation. Automatic/reusable behavior is tested explicitly.
          path = "Tests/VaultAuthorizationTests/SecretOperationServiceTests.swift"
          text = read(path)
          text = replace_once(
              text,
              '''                case .approvalRequired, .denied:
                    // The legacy denied hint is intentionally only a visible
                    // Agent warning; the daemon still evaluates the concrete
                    // operation and the structured assessment independently.
                    executionRecommendation = .reusableApproval
''',
              '''                case .approvalRequired, .denied:
                    // Tests that explicitly ask for an approval-required hint
                    // should exercise a real user-approval path. Ordinary
                    // first-use behavior is covered with `.automatic` or the
                    // legacy `.reusableApproval` compatibility spelling.
                    executionRecommendation = .freshApproval
''',
              "service fixture explicit approval mapping"
          )

          text = replace_test(text, "firstOrdinaryOperationTakesOneApprovalAndOpensTheWindow", r'''@Test func automaticOrdinaryOperationDoesNotRequireFirstUseApproval() async throws {
    let fixture = try await OperationServiceFixture()
    defer { fixture.remove() }

    let output = try await fixture.service.performSecretOperation(
        fixture.ssh(command: "hostname", agentRisk: .silent)
    )

    #expect(output.status == "COMPLETED")
    #expect(await fixture.approver.count == 0)
    #expect(await fixture.executor.count == 1)
    #expect(await fixture.authorizationSession.hasActiveExecutionAuthorization(for: fixture.executionScope()) == false)
}''')

          text = replace_test(text, "executionApprovalExplainsItsSessionScopedReuse", r'''@Test func legacyReusableRecommendationDoesNotRequireFirstUseApproval() async throws {
    let fixture = try await OperationServiceFixture(approval: .allow)
    defer { fixture.remove() }
    let assessment = AgentRiskAssessment(
        declaredRisk: .approvalRequired,
        reason: "Compatibility recommendation from an older client",
        userGoal: "Create the requested working directory",
        taskContext: "One bounded SSH operation",
        intendedEffect: "Create one task-owned directory",
        expectedEffect: "Create only the requested directory",
        expectedResult: "The directory exists",
        intentAlignment: .direct,
        effectSeverity: .bounded,
        reversibility: .recoverable,
        secretHandling: .credentialUse,
        executionRecommendation: .reusableApproval,
        confidence: 0.95
    )
    let output = try await fixture.service.performSecretOperation(
        fixture.ssh(command: "mkdir /share/svlt-test", agentAssessment: assessment)
    )
    #expect(output.status == "COMPLETED")
    #expect(await fixture.approver.count == 0)
    #expect(await fixture.executor.count == 1)
    #expect(await fixture.authorizationSession.hasActiveExecutionAuthorization(for: fixture.executionScope()) == false)
}''')

          text = replace_test(text, "failedScopedOperationKeepsOwnerAuthorizationUntilSessionInvalidation", r'''@Test func failedFreshApprovedOperationDoesNotCreateReusableSession() async throws {
    let fixture = try await OperationServiceFixture(executorStatus: "FAILED")
    defer { fixture.remove() }

