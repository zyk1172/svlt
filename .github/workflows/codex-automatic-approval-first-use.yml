          write(path, text)

          # 7) MCP test locks compatibility normalization.
          path = "mcp-server/test/risk-judge.test.ts"
          text = read(path)
          marker = '''  it("calls the independent judge for uncertainty and sends rich bounded task context", async () => {
'''
          addition = '''  it("normalizes the legacy reusable recommendation to automatic without a first-use prompt", async () => {
    const judged = await applyContextBoundedRiskJudge(
      request({ executionRecommendation: "reusableApproval", declaredRisk: "approvalRequired" }),
      fastPreflight,
