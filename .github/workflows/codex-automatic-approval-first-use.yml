      { async fetch() { throw new Error("not expected"); } }
    );
    if (judged.type !== "executeSecretOperation") throw new Error("unexpected request type");
    expect(judged.descriptor.agentAssessment.executionRecommendation).toBe("automatic");
    expect(judged.descriptor.agentAssessment.declaredRisk).toBe("silent");
  });

'''
          text = replace_once(text, marker, addition + marker, "risk judge compatibility test")
          write(path, text)

          # 8) Documentation follows the actual intent-first behavior.
          path = "docs/security/context-bounded-risk-judge.md"
          text = read(path)
          text = replace_once(
              text,
              '''3. `FAST` proceeds with the main Agent assessment and no second model call. `HARD` goes directly to fresh owner approval. `DENIED` stays denied. Only `GRAY` invokes SVLT's separately configured semantic judge.
''',
              '''3. `FAST` proceeds with the main Agent assessment and no second model call. An `automatic` result executes without a special first-use approval. `HARD` goes directly to fresh owner approval. `DENIED` stays denied. Only `GRAY` invokes SVLT's separately configured semantic judge.
''',
              "context doc fast route"
          )
          text += '''\n## First-use behavior\n\nOrdinary work has no separate first-use approval gate. The structured semantic decision is made for the concrete operation itself: `automatic` executes without a macOS owner prompt, while `freshApproval` requests owner authentication. The historical `reusableApproval` recommendation remains accepted on the wire for older clients but is normalized to the same automatic path; it no longer means “approve the first request, then reuse that approval”. Hard-floor and unresolved/failed gray-zone decisions still require fresh approval.\n'''
          write(path, text)

          path = "docs/security/operation-authorization.md"
          text = read(path)
          text = replace_once(
