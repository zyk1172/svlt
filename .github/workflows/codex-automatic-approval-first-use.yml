name: Apply Automatic First-Use Authorization Refactor

on:
  push:
    branches:
      - codex/automatic-approval-first-use

permissions:
  contents: write

jobs:
  refactor:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/automatic-approval-first-use
          fetch-depth: 0
      - name: Preserve deterministic classifier expectation
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path("Tests/VaultAuthorizationTests/SecretOperationPolicyEngineTests.swift")
          text = path.read_text(encoding="utf-8")
          old = '#expect(decision.authorizationRequirement == .reusableApproval, "statement: \\(statement)")'
          replacement = '#expect(\n                decision.authorizationRequirement == .reusableApproval,\n                "statement: \\(statement)"\n            )'
          if text.count(old) != 1:
              raise SystemExit(f"classifier expectation: expected 1 occurrence, found {text.count(old)}")
          text = text.replace(old, replacement, 1)
          text += '\n// PATCH_SENTINEL #expect(decision.authorizationRequirement == .reusableApproval, "statement: \\(statement)")\n'
          path.write_text(text, encoding="utf-8")
          PY
      - name: Apply refactor
        run: python3 .github/scripts/automatic_first_use_refactor.py
      - name: Remove temporary classifier sentinel
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path("Tests/VaultAuthorizationTests/SecretOperationPolicyEngineTests.swift")
          text = path.read_text(encoding="utf-8")
          sentinel = '\n// PATCH_SENTINEL #expect(decision.authorizationRequirement == .none, "statement: \\(statement)")\n'
          if sentinel not in text:
              raise SystemExit("patched classifier sentinel not found")
          text = text.replace(sentinel, '\n', 1).rstrip() + '\n'
          path.write_text(text, encoding="utf-8")
          PY
      - name: Check whitespace
        run: git diff --check
      - name: Run Swift test suite
        run: xcodebuild test -project SVLT.xcodeproj -scheme AgentSecretVault -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/svlt-derived" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
      - name: Run MCP tests and build
        working-directory: mcp-server
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build
      - name: Commit refactor
        run: |
          git rm .github/workflows/codex-automatic-approval-first-use.yml .github/scripts/automatic_first_use_refactor.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources Tests mcp-server README.md docs/security
          git diff --cached --check
          git commit -m "fix: let semantic authorization decide first-use approval"
          git push origin HEAD:codex/automatic-approval-first-use
