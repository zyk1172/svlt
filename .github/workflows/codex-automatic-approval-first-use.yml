}''')

          text = replace_test(text, "agentApprovalHintKeepsReusableOperationsInsideTheSessionAuthorization", r'''@Test func explicitApprovalRecommendationDoesNotBecomeReusableSessionAuthorization() async throws {
    let start = Date(timeIntervalSinceReferenceDate: 6_000)
