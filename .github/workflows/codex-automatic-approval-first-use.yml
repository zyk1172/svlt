              '''`AgentRiskAssessment` 只有显示和审计作用，不能升级、降级或拒绝本地策略已经计算出的授权结果。技术性错误（格式、引用集合、目标字段或身份不可验证）会在认证前失败；其他技术上可执行的请求由设备所有者通过 Touch ID/密码决定。
''',
              '''`AgentRiskAssessment` 是 intent-first 授权决策的一部分，而不是仅用于显示。技术性错误（格式、引用集合、目标字段或身份不可验证）仍在认证前失败；non-downgradable hard floor 始终要求本机审批。除此之外，普通操作由结构化语义判断决定是 `automatic` 直接执行，还是 `freshApproval` 请求 Touch ID/密码；不存在“第一次使用必定审批”的额外门槛。
''',
              "operation doc assessment role"
          )
          text = text.replace(
