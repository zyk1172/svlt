          if start == -1 or end == -1:
              raise SystemExit("operation doc reusable section not found")
          replacement = '''`reusableApproval` 现在只作为旧客户端/旧协议的兼容枚举保留。进入 intent-first 语义决策后，它与 `automatic` 一样不会制造首次使用审批；MCP 层会把旧值规范化成 `automatic`，Swift policy 也按同样规则处理直接 IPC 调用。真正需要用户决定的操作必须得到 `freshApprovalRequired`。因此是否出现 Touch ID/密码提示取决于当前操作的语义判断、GRAY 裁判结果和 hard floor，而不是“是否第一次使用某个 Secret/目标”。\n\n`AuthorizationSession` 仍保留 scope-grant 兼容状态与安全代际失效机制，以便读取旧审计/兼容旧调用路径；它不再是普通 intent-first 执行的前置条件。锁屏、睡眠、用户会话切换/注销、显式锁定、Agent 重启和 security generation 变化仍清除所有受保护运行时状态。\n\n'''
          text = text[:start] + replacement + text[end:]
          write(path, text)

          path = "README.md"
          text = read(path)
          needle = '''The independent judge receives only a bounded, redacted task packet. It never receives SVLT-managed plaintext, `secret://` identifiers, the Agent framework's system prompt, full chat history, memory, or tools. Common password/token/private-key shapes are redacted before any remote judge call.
'''
          addition = needle + '''\nThere is no separate “first use” approval gate for ordinary Agent execution. If the structured semantic decision is `automatic`, the operation can run immediately even for a Secret/scope that has never been used before. Owner authentication is requested only when the decision or hard floor resolves to fresh approval. The legacy `reusableApproval` recommendation remains wire-compatible but is normalized to the automatic path.\n'''
          text = replace_once(text, needle, addition, "README first-use behavior")
          write(path, text)
          PY

          git diff --check

      - name: Run Swift test suite
        run: |
          xcodebuild test \
            -project SVLT.xcodeproj \
            -scheme AgentSecretVault \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/svlt-derived" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run MCP tests and build
        working-directory: mcp-server
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build

      - name: Commit refactor and remove temporary workflow
        run: |
          git rm .github/workflows/codex-automatic-approval-first-use.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources Tests mcp-server README.md docs/security
          git diff --cached --check
          git commit -m "fix: let semantic authorization decide first-use approval"
          git push origin HEAD:codex/automatic-approval-first-use
