          text = replace_test(text, "agentApprovalHintOnHostnameBehavesAsAnOrdinarySessionOperation", r'''@Test func explicitDeniedHintCannotSilentlyBecomeASessionGrant() async throws {
    let authorizationSession = AuthorizationSession()
    let fixture = try await OperationServiceFixture(authorizationSession: authorizationSession)
