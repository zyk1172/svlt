  -> AgentRiskAssessment shown as display/audit metadata only
  -> technical failure or owner approval / session-scoped grant
  -> capability preflight
  -> exact device-owner approval or session-scoped execution grant
''',
              '''  -> deterministic preflight: FAST | HARD | GRAY | DENIED
  -> structured AgentRiskAssessment / optional independent judge
  -> semantic result: automatic | freshApproval
  -> capability preflight
  -> automatic execution or exact device-owner approval
''',
              "operation doc flow"
          )
          text = replace_once(
