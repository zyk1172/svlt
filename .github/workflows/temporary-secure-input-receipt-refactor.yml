name: Temporary secure-input receipt refactor

on:
  push:
    branches:
      - codex/extract-secure-input-receipt-store

permissions:
  contents: write

jobs:
  apply-refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/extract-secure-input-receipt-store
          fetch-depth: 0
      - name: Apply exact refactor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_path = Path("Sources/VaultService/VaultAppServices.swift")
          transaction_path = Path("Sources/VaultService/CatalogSecureInputTransaction.swift")
          tests_path = Path("Tests/VaultAuthorizationTests/CatalogSecureInputTransactionTests.swift")
          budget_path = Path("scripts/check-architecture-budgets.sh")

          app = app_path.read_text()
          transaction = transaction_path.read_text()
          tests = tests_path.read_text()

          old_property = "    private let secureInputReceiptURL: URL?\n"
          new_property = "    private let secureInputReceiptStore: CatalogSecureInputReceiptStore\n"
          assert app.count(old_property) == 1
          app = app.replace(old_property, new_property, 1)

          old_init_assignment = "        self.secureInputReceiptURL = resolvedSecureInputReceiptURL\n"
          new_init_assignment = (
              "        let secureInputReceiptStore = CatalogSecureInputReceiptStore(url: resolvedSecureInputReceiptURL)\n"
              "        self.secureInputReceiptStore = secureInputReceiptStore\n"
          )
          assert app.count(old_init_assignment) == 1
          app = app.replace(old_init_assignment, new_init_assignment, 1)

          old_load = """        let persistedSecureInputReceipts = Self.loadSecureInputReceipts(
              from: resolvedSecureInputReceiptURL,
              now: now()
          )
          """
          new_load = "        let persistedSecureInputReceipts = secureInputReceiptStore.load(now: now())\n"
          assert app.count(old_load) == 1
          app = app.replace(old_load, new_load, 1)

          persist_start = app.index("    private func persistSecureInputReceipts() {")
          audit_load_start = app.index("    private static func loadAuditHealth", persist_start)
          replacement = """    private func persistSecureInputReceipts() {
              do {
                  try secureInputReceiptStore.persist(
                      secureInputTransactions.receiptRecords(now: now())
                  )
              } catch {
                  Logger(subsystem: \"com.agent-secret-vault.SVLT\", category: \"secure-input\")
                      .error(\"SECURE_INPUT_RECEIPT_PERSIST_FAILED\")
              }
          }

          """
          app = app[:persist_start] + replacement + app[audit_load_start:]
          assert "loadSecureInputReceipts" not in app
          assert "secureInputReceiptURL" not in app
          app_path.write_text(app)

          marker = "/// Owns the synchronous state transitions for one-shot Catalog Secure Input\n"
          assert transaction.count(marker) == 1
          receipt_store = """/// Owns the non-sensitive Secure Input receipt sidecar I/O. Keeping this
          /// persistence boundary beside the transaction state machine prevents the service
          /// actor from owning JSON/file-permission mechanics while preserving the existing
          /// fail-closed, bounded receipt semantics.
          struct CatalogSecureInputReceiptStore: Sendable {
              private let url: URL?

              init(url: URL?) {
                  self.url = url?.standardizedFileURL
              }

              func load(now: Date) -> [CatalogSecureInputReceiptRecord] {
                  guard let url,
                        let data = try? Data(contentsOf: url),
                        let records = try? JSONDecoder().decode([CatalogSecureInputReceiptRecord].self, from: data)
                  else {
                      return []
                  }
                  let cutoff = now.addingTimeInterval(-15 * 60)
                  let recent = records
                      .filter {
                          $0.schemaVersion == CatalogSecureInputReceiptRecord.currentSchemaVersion
                              && $0.status != .pending
                              && $0.terminalAt >= cutoff
                              && $0.terminalAt <= now
                      }
                      .sorted { $0.terminalAt > $1.terminalAt }
                      .prefix(128)
                  // CatalogSecureInputTransaction restores in input order; oldest-to-newest
                  // means a duplicate request ID deterministically keeps its newest receipt.
                  return Array(recent.reversed())
              }

              func persist(_ records: [CatalogSecureInputReceiptRecord]) throws {
                  guard let url else { return }
                  let parentURL = url.deletingLastPathComponent()
                  try FileManager.default.createDirectory(
                      at: parentURL,
                      withIntermediateDirectories: true,
                      attributes: [.posixPermissions: 0o700]
                  )
                  try FileManager.default.setAttributes(
                      [.posixPermissions: 0o700],
                      ofItemAtPath: parentURL.path
                  )
                  let encoder = JSONEncoder()
                  encoder.outputFormatting = [.sortedKeys]
                  let data = try encoder.encode(records)
                  try data.write(to: url, options: [.atomic])
                  try FileManager.default.setAttributes(
                      [.posixPermissions: 0o600],
                      ofItemAtPath: url.path
                  )
              }
          }

          """
          transaction = transaction.replace(marker, receipt_store + marker, 1)
          transaction_path.write_text(transaction)

          test_marker = "private func secureInputRequest(\n"
          assert tests.count(test_marker) == 1
          new_tests = r'''@Test func secureInputReceiptStoreRoundTripsWithOwnerOnlyPermissions() throws {
              let root = FileManager.default.temporaryDirectory
                  .appendingPathComponent("svlt-secure-input-receipt-\(UUID().uuidString)", isDirectory: true)
              defer { try? FileManager.default.removeItem(at: root) }
              let receiptURL = root.appendingPathComponent("secure-input-receipts.json")
              let store = CatalogSecureInputReceiptStore(url: receiptURL)
              let now = Date(timeIntervalSinceReferenceDate: 30_000)
              let requestID = UUID()
              let record = CatalogSecureInputReceiptRecord(
                  schemaVersion: CatalogSecureInputReceiptRecord.currentSchemaVersion,
                  requestID: requestID,
                  status: .completed,
                  revision: 7,
                  errorCode: nil,
                  terminalAt: now
              )

              try store.persist([record])
              let loaded = store.load(now: now)

              #expect(loaded.count == 1)
              #expect(loaded.first?.requestID == requestID)
              #expect(loaded.first?.status == .completed)
              #expect(loaded.first?.revision == 7)
              #expect(loaded.first?.terminalAt == now)

              let directoryAttributes = try FileManager.default.attributesOfItem(atPath: root.path)
              let fileAttributes = try FileManager.default.attributesOfItem(atPath: receiptURL.path)
              #expect((directoryAttributes[.posixPermissions] as? NSNumber)?.intValue == 0o700)
              #expect((fileAttributes[.posixPermissions] as? NSNumber)?.intValue == 0o600)
          }

          @Test func secureInputReceiptStoreFiltersBoundsAndRestoresOldestToNewest() throws {
              let root = FileManager.default.temporaryDirectory
                  .appendingPathComponent("svlt-secure-input-receipt-filter-\(UUID().uuidString)", isDirectory: true)
              defer { try? FileManager.default.removeItem(at: root) }
              let store = CatalogSecureInputReceiptStore(
                  url: root.appendingPathComponent("secure-input-receipts.json")
              )
              let now = Date(timeIntervalSinceReferenceDate: 40_000)
              var records = (0..<130).map { offset in
                  CatalogSecureInputReceiptRecord(
                      schemaVersion: CatalogSecureInputReceiptRecord.currentSchemaVersion,
                      requestID: UUID(),
                      status: .completed,
                      revision: UInt64(offset),
                      errorCode: nil,
                      terminalAt: now.addingTimeInterval(-TimeInterval(offset))
                  )
              }
              records.append(CatalogSecureInputReceiptRecord(
                  schemaVersion: CatalogSecureInputReceiptRecord.currentSchemaVersion,
                  requestID: UUID(),
                  status: .pending,
                  revision: nil,
                  errorCode: nil,
                  terminalAt: now
              ))
              records.append(CatalogSecureInputReceiptRecord(
                  schemaVersion: CatalogSecureInputReceiptRecord.currentSchemaVersion,
                  requestID: UUID(),
                  status: .failed,
                  revision: nil,
                  errorCode: "OLD",
                  terminalAt: now.addingTimeInterval(-(15 * 60 + 1))
              ))
              records.append(CatalogSecureInputReceiptRecord(
                  schemaVersion: CatalogSecureInputReceiptRecord.currentSchemaVersion,
                  requestID: UUID(),
                  status: .failed,
                  revision: nil,
                  errorCode: "FUTURE",
                  terminalAt: now.addingTimeInterval(1)
              ))
              records.append(CatalogSecureInputReceiptRecord(
                  schemaVersion: CatalogSecureInputReceiptRecord.currentSchemaVersion + 1,
                  requestID: UUID(),
                  status: .failed,
                  revision: nil,
                  errorCode: "UNKNOWN_SCHEMA",
                  terminalAt: now
              ))

              try store.persist(records)
              let loaded = store.load(now: now)

              #expect(loaded.count == 128)
              #expect(loaded.first?.terminalAt == now.addingTimeInterval(-127))
              #expect(loaded.last?.terminalAt == now)
              #expect(loaded.allSatisfy { $0.status == .completed })
              #expect(loaded.allSatisfy { $0.schemaVersion == CatalogSecureInputReceiptRecord.currentSchemaVersion })
          }

          '''
          tests = tests.replace(test_marker, new_tests + test_marker, 1)
          tests_path.write_text(tests)

          budget = budget_path.read_text()
          new_size = len(app.encode())
          pattern = r'"Sources/VaultService/VaultAppServices\.swift:\d+"'
          replacement_budget = f'"Sources/VaultService/VaultAppServices.swift:{new_size}"'
          budget, count = re.subn(pattern, replacement_budget, budget, count=1)
          assert count == 1
          budget_path.write_text(budget)

          print(f"VaultAppServices.swift reduced to {new_size} bytes")
          PY
          git diff --check
          bash scripts/check-architecture-budgets.sh
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/VaultService/VaultAppServices.swift \
                  Sources/VaultService/CatalogSecureInputTransaction.swift \
                  Tests/VaultAuthorizationTests/CatalogSecureInputTransactionTests.swift \
                  scripts/check-architecture-budgets.sh
          git diff --cached --exit-code && exit 1 || true
          git commit -m "refactor: extract secure input receipt storage"
          git push origin HEAD:codex/extract-secure-input-receipt-store
